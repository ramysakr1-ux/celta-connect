  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"35a43a75-136c-436d-8660-799f9d822e2f\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<script src=\"72dc8074-1fa6-4f3a-8cd4-42036630b8cf\"><\u002Fscript>\n<style>\n  body { margin: 0; background: oklch(92.5% 0.012 85); font-family: Karla, Helvetica, sans-serif; font-size: 11px; line-height: 1.5; }\n  a { color: oklch(38% 0.072 195); }\n  @media print {\n    @page { size: A4; margin: 14mm; }\n    body { background: white; margin: 0; padding: 0; }\n  }\n  table { border-collapse: collapse; width: 100%; }\n  td, th { border: 1px solid oklch(83% 0.024 85); padding: 6px 8px; text-align: left; vertical-align: top; background: oklch(97% 0.016 85); }\n  th { background: oklch(93% 0.03 85); font-weight: 700; font-size: 9px; text-transform: uppercase; color: oklch(40% 0.03 75); }\n  .section-header { font-size: 13px; font-weight: 700; margin: 0 0 6px 0; }\n  .section-num { font-size: 9px; color: oklch(51% 0.017 70); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }\n  .page-break { page-break-after: always; padding-bottom: 40px; margin-bottom: 40px; border-bottom: 2px solid oklch(88% 0.016 82); counter-increment: pg; position: relative; }\n  x-dc { counter-reset: pg; }\n  .page-break::after { content: \"CELTA 5 — page \" counter(pg); position: absolute; right: 0; bottom: 10px; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(58% 0.017 70); }\n  .box { min-height: 60px; border: 1px solid oklch(83% 0.024 85); border-radius: 8px; padding: 12px; background: oklch(97% 0.016 85); }\n  .pill-group { display: flex; gap: 4px; }\n  .pill-group input { position: absolute; opacity: 0; width: 0; height: 0; }\n  .pill-group label { padding: 4px 8px; border-radius: 5px; font-size: 9px; font-weight: 700; cursor: pointer; border: 1px solid oklch(83% 0.024 85); color: oklch(51% 0.017 70); background: oklch(94.5% 0.02 85); }\n  .pill-group input:checked + label.sp { background: oklch(64% 0.13 155); color: white; border-color: oklch(64% 0.13 155); }\n  .pill-group input:checked + label.s { background: oklch(55% 0.09 195); color: white; border-color: oklch(55% 0.09 195); }\n  .pill-group input:checked + label.n { background: oklch(58% 0.17 25); color: white; border-color: oklch(58% 0.17 25); }\n  .pill-group input:checked + label.x { background: oklch(62% 0.01 85); color: white; border-color: oklch(62% 0.01 85); }\n  .pill-group input:disabled + label { opacity: 0.55; cursor: not-allowed; }\n  .badge { display: inline-block; padding: 3px 9px; border-radius: 5px; font-size: 9px; font-weight: 700; }\n  .clean-line { border: 1px solid oklch(83% 0.024 85); border-radius: 6px; background: oklch(94.5% 0.02 85); font-family: inherit; font-size: inherit; padding: 5px 9px; color: oklch(23.5% 0.017 65); }\n  .clean-line:focus { outline: none; border-color: oklch(55% 0.09 195); box-shadow: 0 0 0 3px color-mix(in oklab, oklch(55% 0.09 195) 15%, transparent); }\n  input[type=\"text\"], select { font-family: inherit; font-size: inherit; color: oklch(23.5% 0.017 65); border: 1px solid oklch(83% 0.024 85); border-radius: 6px; background: oklch(94.5% 0.02 85); padding: 5px 9px; }\n  input[type=\"text\"]:focus, select:focus { outline: none; border-color: oklch(55% 0.09 195); box-shadow: 0 0 0 3px color-mix(in oklab, oklch(55% 0.09 195) 15%, transparent); }\n  select { padding: 5px 8px; }\n  select:disabled, input:disabled { opacity: 0.6; cursor: not-allowed; }\n  input[type=\"radio\"] { appearance: none; width: 16px; height: 16px; border-radius: 50%; border: 1px solid oklch(83% 0.024 85); background: oklch(94.5% 0.02 85); cursor: pointer; }\n  table { table-layout: fixed; }\n  td input[type=\"text\"], td select { width: 100%; box-sizing: border-box; }\n  .lockbox { border: 1px dashed oklch(83% 0.024 85); border-radius: 8px; padding: 14px; background: oklch(94.5% 0.02 85); font-size: 10px; color: oklch(51% 0.017 70); font-style: italic; }\n  .pulled-tag { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: oklch(38% 0.072 195); background: color-mix(in oklab, oklch(38% 0.072 195) 12%, oklch(97% 0.016 85)); padding: 2px 6px; border-radius: 4px; }\n  .act-btn { display: inline-block; border: 1px solid oklch(38% 0.072 195); background: oklch(38% 0.072 195); color: white; font-weight: 700; font-size: 10px; padding: 8px 14px; border-radius: 6px; cursor: pointer; }\n  .act-btn.ghost { background: transparent; color: oklch(38% 0.072 195); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: 900px; margin: 0 auto; padding: 48px;\" ref=\"{{ rootRef }}\" sc-camel-on-change=\"{{ handleChange }}\">\n\n<!-- ROLE SWITCH -->\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; padding: 10px 14px; border: 1px solid oklch(83% 0.024 85); border-radius: 8px; background: oklch(97% 0.016 85);\">\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70);\">Viewing as — this switch is for demonstrating the automation; it is not part of the CELTA 5 text.<\u002Fdiv>\n<div style=\"display: flex; gap: 6px;\">\n<div sc-camel-on-click=\"{{ setRoleTrainee }}\" style=\"padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; background: {{ traineeBtnBg }}; color: {{ traineeBtnInk }}; border: 1px solid oklch(38% 0.072 195);\">Trainee<\u002Fdiv>\n<div sc-camel-on-click=\"{{ setRoleTutor }}\" style=\"padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; background: {{ tutorBtnBg }}; color: {{ tutorBtnInk }}; border: 1px solid oklch(38% 0.072 195);\">Tutor<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- COVER -->\n<div class=\"page-break\">\n<div style=\"margin-bottom: 32px;\">\n<image-slot id=\"cambridge-logo\" shape=\"rect\" placeholder=\"Cambridge English logo\" style=\"width: 200px; height: 60px;\"><\u002Fimage-slot>\n<\u002Fdiv>\n<div style=\"margin-bottom: 32px;\">\n<div style=\"font-size: 13px; font-weight: 700; color: oklch(23.5% 0.017 65); margin-bottom: 4px;\">Certificate in Teaching English to Speakers of Other Languages<\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 40px; font-weight: 700; color: oklch(23.5% 0.017 65); margin: 8px 0;\">CELTA<\u002Fdiv>\n<div style=\"font-size: 14px; font-weight: 700; color: oklch(23.5% 0.017 65);\">Candidate Record Booklet CELTA 5<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;\">Candidate Name: <input type=\"text\" class=\"clean-line\" style=\"width: 260px;\"><\u002Fdiv>\n<div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;\">\n<span style=\"font-size: 12px;\">Centre Number:<\u002Fspan>\n<div style=\"display: flex; gap: 3px;\">\n<sc-for list=\"{{ centreDigits }}\" as=\"d\" hint-placeholder-count=\"6\">\n<div style=\"width: 20px; height: 24px; border: 1px solid oklch(83% 0.024 85); background: oklch(94.5% 0.02 85); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;\">{{ d }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;\">Centre Name: <input type=\"text\" class=\"clean-line\" style=\"width: 260px;\"><\u002Fdiv>\n<div style=\"font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;\">Course Number: <input type=\"text\" class=\"clean-line\" style=\"width: 160px;\"><\u002Fdiv>\n<div style=\"font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;\">Course Dates: <input type=\"text\" class=\"clean-line\" style=\"width: 220px;\"><\u002Fdiv>\n<div style=\"font-size: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;\">Tutors: <input type=\"text\" class=\"clean-line\" style=\"width: 300px;\"><\u002Fdiv>\n<div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;\">\n<span style=\"font-size: 12px;\">Unique Learner Number ULN:<\u002Fspan>\n<div style=\"display: flex; gap: 3px;\">\n<sc-for list=\"{{ ulnDigits }}\" as=\"d\" hint-placeholder-count=\"10\">\n<div style=\"width: 20px; height: 24px; border: 1px solid oklch(83% 0.024 85); background: oklch(94.5% 0.02 85); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px;\">&nbsp;<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); line-height: 1.6;\">ULN is a 10-digit identifier which is applied, where required, to the Personal Learning Record of anyone over the age of 14 involved in UK education or training.<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); line-height: 1.6; margin-top: 12px;\">This booklet has to be submitted during the course and at the end of the course for assessment purposes.<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); line-height: 1.6; margin-top: 12px;\">To assist Cambridge English in conducting research and validation of teaching qualifications, please complete the electronic candidate information sheet <a href=\"#\">here<\u002Fa>.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- CONTENTS -->\n<div class=\"page-break\">\n<div class=\"section-header\">Contents<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 12px;\">(Click to open the section)<\u002Fdiv>\n<ol style=\"font-size: 10px; line-height: 2.2; padding-left: 22px; margin: 0;\">\n<li><a href=\"#sec1\">ROLES AND RESPONSIBILITIES OF CANDIDATES, CENTRES AND CAMBRIDGE ASSESSMENT ENGLISH<\u002Fa><\u002Fli>\n<li><a href=\"#sec2\">CANDIDATE PORTFOLIO<\u002Fa><\u002Fli>\n<li><a href=\"#sec3\">CAMBRIDGE ENGLISH APPEALS PROCEDURE<\u002Fa><\u002Fli>\n<li><a href=\"#sec4\">CANDIDATE GUIDE TO ASSESSMENT<\u002Fa><\u002Fli>\n<li><a href=\"#sec5\">RECORD OF ATTENDANCE<\u002Fa><\u002Fli>\n<li><a href=\"#sec6\">RECORD OF OBSERVATIONS OF EXPERIENCED CLASSROOM TEACHERS (INCLUDING FILMED OBSERVATIONS)<\u002Fa><\u002Fli>\n<li><a href=\"#sec7\">RECORD OF ASSESSED TEACHING PRACTICE<\u002Fa><\u002Fli>\n<li><a href=\"#sec8\">RECORD OF ASSESSMENT OF WRITTEN ASSIGNMENTS<\u002Fa><\u002Fli>\n<li><a href=\"#sec9\">STAGE ONE PROGRESS RECORD<\u002Fa><\u002Fli>\n<li><a href=\"#sec10\">STAGE TWO PROGRESS RECORD<\u002Fa><\u002Fli>\n<li><a href=\"#sec11\">STAGE THREE PROGRESS RECORD<\u002Fa><\u002Fli>\n<li><a href=\"#sec12\">TO BE COMPLETED ON THE FINAL DAY OF THE COURSE<\u002Fa><\u002Fli>\n<li><a href=\"#sec13\">APPENDIX 1 – CELTA Criteria<\u002Fa><\u002Fli>\n<li><a href=\"#sec14\">APPENDIX 2 – CELTA Performance Descriptors<\u002Fa><\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n\n<!-- PROGRESS OVERVIEW (auto-tracked, not part of the original booklet) -->\n<div class=\"page-break\">\n<div class=\"section-header\">Progress overview<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 16px;\">Pulled automatically from Observations, TP Record, Written Assignments and the tutorial records. Not part of the official CELTA 5 text.<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px;\">\n<div class=\"box\">\n<div style=\"font-weight: 700; font-size: 11px; margin-bottom: 6px;\">Attendance <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 700;\">{{ attendancePctLabel }}<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-top: 4px;\">{{ hoursAttendedLabel }} / {{ courseHoursLabel }} hours attended<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"box\">\n<div style=\"font-weight: 700; font-size: 11px; margin-bottom: 6px;\">Observation hours <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 700; color: {{ obsColor }};\">{{ obsHoursLabel }} / 6.00<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-top: 4px;\">filmed capped at 3 of the 6 hrs<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"box\">\n<div style=\"font-weight: 700; font-size: 11px; margin-bottom: 6px;\">Assessed TP hours <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 700; color: {{ tpColor }};\">{{ tpHoursLabel }} / 6.00<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-top: 4px;\">at two levels required<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"box\">\n<div style=\"font-weight: 700; font-size: 11px; margin-bottom: 6px;\">Written assignments <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 700;\">{{ assignSummaryLabel }}<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-top: 4px;\">{{ assignPass }} passed · {{ assignPending }} pending<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ROLES AND RESPONSIBILITIES -->\n<div class=\"page-break\" id=\"sec1\">\n<div class=\"section-header\">Roles and responsibilities of candidates, centres and Cambridge English<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7;\">\n<p style=\"font-weight: 700; margin-top: 16px;\">Candidates<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>to attend and participate in the course<\u002Fli>\n<li>to comply with any rules/code of conduct set out by the centre<\u002Fli>\n<li>to complete six hours' supervised teaching practice at two different levels<\u002Fli>\n<li>to complete six hours' classroom observation of experienced teachers, three hours of which may be of filmed lessons<\u002Fli>\n<li>to complete four written assignments<\u002Fli>\n<li>to submit assignments in accordance with the centre's submission deadlines and policies<\u002Fli>\n<li>to work supportively and collaboratively with colleagues and course tutors<\u002Fli>\n<li>to maintain a Candidate Portfolio throughout the course (including the CELTA 5 Record Booklet which must be kept up-to-date and signed/confirmed as appropriate)<\u002Fli>\n<li>to submit an up-to-date completed Candidate Portfolio when required, e.g. immediately prior to the external assessor's visit<\u002Fli>\n<li>to submit a completed Candidate Portfolio at the end of the course for final assessment<\u002Fli>\n<\u002Ful>\n<p style=\"font-weight: 700; margin-top: 16px;\">The Centre<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>to provide prospective candidates with information about the course<\u002Fli>\n<li>to administer recruitment and selection procedures and follow up related queries<\u002Fli>\n<li>to provide a candidate agreement detailing, for example: the attendance policy, plagiarism information, the complaints policy, any policies on resubmissions of written work etc.<\u002Fli>\n<li>to deliver CELTA in accordance with the centre's equal opportunities policy<\u002Fli>\n<li>to observe local laws regarding staff employment and copyright<\u002Fli>\n<li>to have a procedure for dealing with special requirements<\u002Fli>\n<li>to provide a course of the minimum number of hours including assessed teaching practice and directed observation of teachers as specified in the CELTA Syllabus<\u002Fli>\n<li>to deliver the course in suitable accommodation with access to the required resources<\u002Fli>\n<li>to monitor completion of portfolios including the CELTA 5 Record Booklet<\u002Fli>\n<li>to make clear to candidates the centre's assignment submission deadlines and policies<\u002Fli>\n<li>to support and guide candidates during the course, and give appropriate feedback on progress in relation to the assessment criteria<\u002Fli>\n<li>to display the Centre Authorisation Certificate and ensure that the CELTA Syllabus and the CELTA Administration Handbook are available on request<\u002Fli>\n<li>to make candidates aware of the centre's internal complaints procedure<\u002Fli>\n<li>to provide an end-of-course report for candidates<\u002Fli>\n<li>to despatch certificates issued by Cambridge English<\u002Fli>\n<li>where relevant in UK learning and skills contexts, to obtain on behalf of the candidate a unique learner number (ULN) and a learner record<\u002Fli>\n<\u002Ful>\n<p style=\"font-weight: 700; margin-top: 16px;\">Cambridge English<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>to approve centres<\u002Fli>\n<li>to provide the syllabus and assessment criteria<\u002Fli>\n<li>to quality assure course delivery and assessment<\u002Fli>\n<li>to ensure trainers are selected and trained in line with Cambridge English guidelines<\u002Fli>\n<li>to hold regular Grade Review meetings to review and confirm candidates' results<\u002Fli>\n<li>to issue candidates' certificates<\u002Fli>\n<li>to follow up any appeals (see Cambridge English Appeals Procedure page 4)<\u002Fli>\n<li>to provide advice and support to centres<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PORTFOLIO -->\n<div class=\"page-break\" id=\"sec2\">\n<div class=\"section-header\">Candidate portfolio<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7;\">\n<p style=\"font-weight: 700; margin-top: 16px;\">What is the Candidate Portfolio?<\u002Fp>\n<p>The Candidate Portfolio represents the work on the course which will be assessed for your final course grade to be awarded. Portfolio documents must be uploaded to the file storage platform used by the centre and kept up-to-date, ready to view by the Cambridge English assessor. The portfolio must also be complete at the end of the course.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Why do Cambridge English assessors need to see portfolios?<\u002Fp>\n<p>Assessors scrutinise a selection of portfolios to moderate candidates' work on the course, and to agree provisional and final recommended results.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">What information does Cambridge English collect?<\u002Fp>\n<p>The centre stores portfolios and provides Cambridge English assessors and moderators with viewing rights via a link to the folders. Cambridge English does not retain copies of portfolios. Centres retain portfolios for six months after the end of the course, after which they should be deleted. You may keep copies of any of the content you wish to retain.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">How does Cambridge English protect my information?<\u002Fp>\n<p>The only personal information that Cambridge English needs to finalise your results is your full name and course number. You do not need to provide any other identifying information in your portfolio. The confidentiality of portfolios is maintained via a secure, password protected platform, and assessors submit their course reports securely on this system.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Who can I ask about the handling of my personal information?<\u002Fp>\n<p>If you have any questions about the way your personal information is stored, contact your centre administration in the first instance. If your query relates to the way Cambridge English accesses your information, the centre can follow up with Cambridge English on your behalf.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Portfolio Contents<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>The Candidate Record Booklet CELTA 5<\u002Fli>\n<li>All assessed teaching practice lesson plans, lesson materials, handouts you have given to learners, tutor feedback comments and self-evaluations<\u002Fli>\n<li>All assessed written assignments (both first submissions and resubmissions where applicable) and tutor feedback comments<\u002Fli>\n<\u002Ful>\n<p style=\"font-weight: 700; margin-top: 16px;\">Portfolio Organisation<\u002Fp>\n<p>The portfolio is divided into sections. It must be organised in the following way:<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>The Candidate Record Booklet CELTA 5<\u002Fli>\n<li>TP lessons, to include:\n<ul style=\"margin: 4px 0; padding-left: 20px;\">\n<li>lesson plan<\u002Fli>\n<li>copies of materials, lesson handouts, worksheets given to learners<\u002Fli>\n<li>self-evaluation<\u002Fli>\n<li>tutor feedback comments<\u002Fli>\n<\u002Ful>\n<\u002Fli>\n<li>Written assignments to include:\n<ul style=\"margin: 4px 0; padding-left: 20px;\">\n<li>written assignment<\u002Fli>\n<li>tutor feedback comments<\u002Fli>\n<\u002Ful>\n<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; padding: 16px; background: oklch(97% 0.016 85); border: 1px solid oklch(83% 0.024 85); border-radius: 8px; font-size: 11px;\">\n<p style=\"margin-top: 0;\">I confirm that I have understood and accept the above requirements for the CELTA portfolio and that without meeting these requirements, it will not be possible for my work on the course to be assessed for the purpose of awarding the certificate. I understand that if my portfolio is not available at the times specified by the centre, I will be considered as having withdrawn from assessment and will not receive a final recommended grade.<\u002Fp>\n<div style=\"margin-top: 20px; display: flex; align-items: center; gap: 8px;\">Name: <input type=\"text\" class=\"clean-line\" style=\"width: 280px;\"><\u002Fdiv>\n<div style=\"margin-top: 10px; display: flex; align-items: center; gap: 8px;\">Signed: <input type=\"text\" class=\"clean-line\" style=\"width: 280px;\"><\u002Fdiv>\n<div style=\"font-size: 9px; color: oklch(51% 0.017 70); margin-top: 10px;\">Type your name both next to “Name” and “Signed” or add a digital signature.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- APPEALS -->\n<div class=\"page-break\" id=\"sec3\">\n<div class=\"section-header\">Cambridge English appeals procedure<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7;\">\n<p>Cambridge English aims to provide access to English language teaching courses of the highest possible quality. However, there may be occasions when candidates have concerns regarding the course provision offered by a centre and/or their final result. The information below provides guidance for the procedures to follow in such cases.<\u002Fp>\n<p>If you have concerns regarding the course provision or the assessment of your performance during the course, these should be raised with the centre as soon as possible, so that the centre has an opportunity to address them while the course is still in progress.<\u002Fp>\n<p>It is possible to raise concerns:<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>as part of general feedback during the course in which candidates may be invited to discuss the course or to complete a feedback form<\u002Fli>\n<li>during a scheduled individual tutorial with one of the course tutors<\u002Fli>\n<li>in a meeting with a course tutor/centre representative as and when a concern occurs.<\u002Fli>\n<\u002Ful>\n<p>In addition, each course is visited by an external assessor for quality assurance purposes. The assessor checks the extent to which centres/courses are meeting Cambridge English requirements regarding, e.g. course delivery, facilities, assessment of candidate performance. You may request an opportunity to speak to the assessor about your concerns during their visit which usually takes place towards the end of the course.<\u002Fp>\n<p>Early discussion with your centre may help to resolve issues. However, in some cases, concerns may persist. For this reason, centres are required to have an internal complaints procedure to help to address any unresolved issues.<\u002Fp>\n<p>If you are unhappy with the final grade recommended by your tutors at the end of the course, you should raise this with your centre in the first instance. A representative from the centre should discuss with you the reasons for the final recommended grade. If you are dissatisfied with the outcome of this discussion, you can request to complete the centre's internal complaints procedure.<\u002Fp>\n<p>Please note that all grades recommended by a centre at the end of a course remain provisional until confirmed by Cambridge English after verification by a Chief Assessor.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Appeals to Cambridge English<\u002Fp>\n<p>If you have completed all stages of your centre's internal complaints procedure and you remain dissatisfied with the response regarding course provision and/or unhappy with the final result once it is confirmed by Cambridge English, you may make an appeal to Cambridge English.<\u002Fp>\n<p>Candidates may request an enquiry regarding a result and/or make a complaint about course provision. There is an administrative fee payable as part of the Appeal Stage One, the details of which can be found in the Cambridge English Teaching Qualifications Stage One Appeal Form. Where investigation leads to a change of grade, the appeal fee will be refunded.<\u002Fp>\n<p>All requests for an appeal must be sent to Cambridge English via the centre within two weeks of you receiving your final result. Please note that an appeal must be made by you and not by a third party.<\u002Fp>\n<p>An investigation into an appeal involves a clerical check of the result by Cambridge English and scrutiny of the following:<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>an Appeal Stage One form<\u002Fli>\n<li>your portfolio and CELTA 5 Record Booklet<\u002Fli>\n<li>the Assessor's Report for the course you undertook<\u002Fli>\n<li>Other documents and correspondence including the following:\n<ul style=\"margin: 4px 0; padding-left: 20px;\">\n<li>the centre's response to the appeal<\u002Fli>\n<li>the centre's terms and conditions<\u002Fli>\n<li>candidate application and selection notes.<\u002Fli>\n<\u002Ful>\n<\u002Fli>\n<\u002Ful>\n<p>Your centre will provide you with the Cambridge English Teaching Qualifications Stage One Appeal Form. This can be downloaded from the Teaching Qualifications section of the Customer Support Website. Please complete the form, detailing all your concerns and submit this to your centre.<\u002Fp>\n<p>Once the centre has received a copy of the form, the centre writes their response to the issues raised. The centre sends to Cambridge English your form, their response to your appeal and your portfolio and other related documentation within two weeks of receiving your completed Stage One Form.<\u002Fp>\n<p>A Chief Assessor, who has had no previous involvement with your course/result, reviews the documentation and prepares a report. The report is then sent to an independent reviewer who reviews the decision and confirms whether the appeals procedure has been followed correctly. In addition, any concerns noted by the independent reviewer from their scrutiny of the centre and candidate documentation are raised with the centre by a Cambridge English Assessment Manager.<\u002Fp>\n<p>If you are dissatisfied after receiving your Stage One report, you have the opportunity to submit an appeal for review by an Independent Appeals Investigator – a Stage Two Appeal.<\u002Fp>\n<p>You can request the Cambridge English Teaching Qualifications Stage Two Appeal Form from the Cambridge English Teaching Qualifications Appeals email address: TeachingAwardAppeals@CambridgeEnglish.org<\u002Fp>\n<p>A Stage Two Appeal must be submitted by you and not by a third party within two weeks of receiving the Stage One report.<\u002Fp>\n<p>There is an administrative fee payable as part of the Stage Two Appeal, and the details of the fees can be found in the Cambridge English Teaching Qualifications Stage Two Appeal Form.<\u002Fp>\n<p>You will be provided with a formal report from an Independent Appeals Investigator. There is no further re-assessment of your work at this stage. The Independent Appeals Investigator will only consider concerns raised regarding a centre's conduct, course provision and/or concerns about the way that Cambridge English handled the Stage One Appeal.<\u002Fp>\n<p>Please note that Cambridge English is not able to investigate spoken comments, or incidents that took place during the course for which there is no record. It is also not possible for Cambridge English to intervene in the following:<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>contractual arrangements between centres and candidates<\u002Fli>\n<li>issues relating to the payment of fees<\u002Fli>\n<li>requests for refunds<\u002Fli>\n<li>issues relating to candidates' accommodation<\u002Fli>\n<li>the conduct of centre staff and tutors<\u002Fli>\n<li>end-of-course reports issued by the centre.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; padding: 16px; background: oklch(97% 0.016 85); border: 1px solid oklch(83% 0.024 85); border-radius: 8px; font-size: 11px;\">\n<p style=\"margin-top: 0;\">I confirm that I have read the Cambridge English Appeals Procedure.<\u002Fp>\n<div style=\"margin-top: 20px; display: flex; align-items: center; gap: 8px;\">Name: <input type=\"text\" class=\"clean-line\" style=\"width: 280px;\"><\u002Fdiv>\n<div style=\"margin-top: 10px; display: flex; align-items: center; gap: 8px;\">Signed: <input type=\"text\" class=\"clean-line\" style=\"width: 280px;\"><\u002Fdiv>\n<div style=\"font-size: 9px; color: oklch(51% 0.017 70); margin-top: 10px;\">Type your name both next to “Name” and “Signed” or add a digital signature.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- CANDIDATE GUIDE TO ASSESSMENT -->\n<div class=\"page-break\" id=\"sec4\">\n<div class=\"section-header\">Candidate guide to assessment<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7;\">\n<p style=\"font-weight: 700; margin-top: 16px;\">Course content<\u002Fp>\n<p>The course covers five topic areas. These are listed in Table 1 below.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Programme delivery<\u002Fp>\n<p>Courses are designed to deliver an integrated programme. They are not designed to deliver each topic area as a block of learning and most sessions in the programme will make reference to subject matter covered in more than one area. For example, a language analysis session may include language analysis for the teacher (Topic 2, Language analysis and awareness); problems particular learners may have with a language area (Topic 1, Learners and teachers and the teaching and learning context); strategies for classroom teaching (Topic 4, Planning and resources and Topic 5, Developing teaching skills and professionalism). Over the course, you build up knowledge related to all the topics covered in the CELTA Syllabus while at the same time developing your classroom skills.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Assessment<\u002Fp>\n<p>There are two modes of assessment:<\u002Fp>\n<ol style=\"margin: 8px 0; padding-left: 20px;\">\n<li>written assignments which relate directly to one or more topics<\u002Fli>\n<li>continuous assessment of teaching practice, which includes planning, teaching and self-evaluation.<\u002Fli>\n<\u002Fol>\n<p>The following table summarises how the assessment relates to the five topics. Written assignment titles are in italics.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 12px;\">Table 1 – Assessment of CELTA Syllabus Topics<\u002Fp>\n<sc-raw-table style=\"margin: 8px 0 4px 0;\">\n<sc-raw-tr><sc-raw-th style=\"width: 10%;\">&nbsp;<\u002Fsc-raw-th><sc-raw-th style=\"width: 26%;\">Topic Title<\u002Fsc-raw-th><sc-raw-th style=\"width: 32%;\">Assessment (main)<\u002Fsc-raw-th><sc-raw-th style=\"width: 32%;\">Assessment (secondary source)<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Topic 1<\u002Fsc-raw-td><sc-raw-td>Learners and teachers and the teaching and learning context<\u002Fsc-raw-td><sc-raw-td><em>Focus on the learner<\u002Fem>; Lesson planning and teaching<\u002Fsc-raw-td><sc-raw-td><em>Language related tasks<\u002Fem>; <em>Skills assignment<\u002Fem>; <em>Lessons from the classroom<\u002Fem><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Topic 2<\u002Fsc-raw-td><sc-raw-td>Language analysis and awareness<\u002Fsc-raw-td><sc-raw-td><em>Language related tasks<\u002Fem>; Lesson planning and teaching<\u002Fsc-raw-td><sc-raw-td><em>Focus on the learner<\u002Fem>; Lesson evaluations<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Topic 3<\u002Fsc-raw-td><sc-raw-td>Language skills: reading, listening, speaking and writing<\u002Fsc-raw-td><sc-raw-td><em>Skills assignment<\u002Fem>; Lesson planning and teaching<\u002Fsc-raw-td><sc-raw-td><em>Focus on the learner<\u002Fem>; Lesson evaluations<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Topic 4<\u002Fsc-raw-td><sc-raw-td>Planning and resources for different teaching contexts<\u002Fsc-raw-td><sc-raw-td><em>Lessons from the classroom<\u002Fem>; Lesson planning and teaching; Lesson evaluations<\u002Fsc-raw-td><sc-raw-td><em>Language related tasks<\u002Fem>; <em>Skills assignment<\u002Fem>; <em>Focus on the learner<\u002Fem><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Topic 5<\u002Fsc-raw-td><sc-raw-td>Developing teaching skills and professionalism<\u002Fsc-raw-td><sc-raw-td><em>Lessons from the classroom<\u002Fem>; Lesson planning and teaching; Lesson evaluations<\u002Fsc-raw-td><sc-raw-td><em>Focus on the learner<\u002Fem>; <em>Skills assignment<\u002Fem>; <em>Language related tasks<\u002Fem><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<p style=\"font-weight: 700; margin-top: 16px;\">Assessment of written work<\u002Fp>\n<p>Written assignments are graded Pass/Fail. You must meet all the criteria for written work during the course (see page 12). The assessment criteria for each written assignment are detailed in the CELTA Syllabus. The full syllabus can be accessed on the Cambridge English website at www.CambridgeEnglish.org/teaching<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Assessment of teaching practice<\u002Fp>\n<p>The assessment criteria for teaching practice are detailed in the Stage Two Progress Record in this booklet. Appendix 1 provides more detail about these criteria.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Continuous assessment<\u002Fp>\n<p>Continuous assessment of teaching takes place throughout the course. Effective teaching is the result of a combination of skills which are acquired over time. In the early stages of the course, you are assessed against specific assessment criteria and partial performance related to what can be expected at that stage of the course. Towards the end of the course, while continuing to assess individual lessons with reference to specific criteria, tutors take a 'holistic' view of your performance which takes account of:<\u002Fp>\n<ol style=\"margin: 8px 0; padding-left: 20px;\">\n<li>your development over the course<\u002Fli>\n<li>the consistency of your achievement in relation to all the assessment criteria<\u002Fli>\n<li>your ability to manage the whole learning process<\u002Fli>\n<li>the range of lesson types in which you have demonstrated competence<\u002Fli>\n<li>your ability to cope with learners at different levels<\u002Fli>\n<li>the amount of support given by the tutor (As with any kind of training more autonomy is expected at the end of the training process.)<\u002Fli>\n<\u002Fol>\n<p style=\"font-weight: 700; margin-top: 16px;\">Grading of individual lessons<\u002Fp>\n<p>Tutors make an overall assessment of each lesson in relation to the criteria relevant to the lesson and stage of the course. As the course progresses, they will also indicate what you need to do to achieve the standard expected at the end of the course.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Final grading<\u002Fp>\n<p>The final grade is a holistic assessment rather than an average of grades and will take into account the factors outlined above. Weak lessons early in the course do not count against you if sufficient progress is achieved. Lessons in the early part of the course will be graded in relation to the stage of the course and your lessons in the second half of the course need to show that progress has been made and that you are able to plan and teach more independently. A satisfactory final lesson does not automatically indicate an overall pass. An overall pass will depend on whether you have been able to achieve the main assessment objectives in the course as a whole. See also Appendix 2 – CELTA performance descriptors, which describes performance required for each passing grade.<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 16px;\">Charting progress<\u002Fp>\n<p>Your progress over the course is charted in this record booklet, which is called CELTA 5. You also receive written feedback after each teaching practice session. In addition, you receive at least one individual tutorial during the course.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ATTENDANCE -->\n<div class=\"page-break\" id=\"sec5\">\n<div class=\"section-header\">Record of attendance<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px; font-size: 12px; margin-bottom: 16px;\">\n<div style=\"display: flex; align-items: center; gap: 8px;\">Total number of course hours: <span style=\"font-weight: 700;\">{{ courseHoursLabel }}<\u002Fspan> <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 8px;\">Total number of hours attended: <span style=\"font-weight: 700;\">{{ hoursAttendedLabel }}<\u002Fspan> <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); line-height: 1.6; margin-bottom: 16px;\">Please note that 100% attendance is expected. However, in the event of unavoidable absence such as illness, family bereavement or unexpected family commitment, this must be recorded (see below) and the work from the session missed must be made up.<\u002Fdiv>\n<sc-raw-table style=\"margin-bottom: 20px;\">\n<sc-raw-tr><sc-raw-th colspan=\"4\">Date/times of unavoidable absences<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-th>Session missed<\u002Fsc-raw-th><sc-raw-th>Reason<\u002Fsc-raw-th><sc-raw-th>How work made up, e.g. discussion with tutor/tasks completed<\u002Fsc-raw-th><sc-raw-th>Tutor signature<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-for list=\"{{ blankRows4 }}\" as=\"r\" hint-placeholder-count=\"4\">\n<sc-raw-tr><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-table>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 12px;\">Please note that unexplained or inappropriate absences/late arrivals will be recorded by the Course Tutor.<\u002Fdiv>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th colspan=\"5\">Date/times of other absences/late arrivals<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-th>Session missed<\u002Fsc-raw-th><sc-raw-th>Reason<\u002Fsc-raw-th><sc-raw-th>Work made up<\u002Fsc-raw-th><sc-raw-th>Candidate comment<\u002Fsc-raw-th><sc-raw-th>Tutor comment/signature<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-for list=\"{{ blankRows4 }}\" as=\"r\" hint-placeholder-count=\"4\">\n<sc-raw-tr><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n\n<!-- OBSERVATIONS -->\n<div class=\"page-break\" id=\"sec6\">\n<div class=\"section-header\">Record of observations of experienced classroom teachers (including filmed observations)<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 10px;\">Rows below are pulled automatically from Observations as they are logged. <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>Lesson length (Minutes)<\u002Fsc-raw-th><sc-raw-th>Level of class<\u002Fsc-raw-th><sc-raw-th>No. of learners present<\u002Fsc-raw-th><sc-raw-th>Lesson focus<\u002Fsc-raw-th><sc-raw-th>Kind<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-for list=\"{{ obsRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n<sc-raw-tr><sc-raw-td>{{ r.date }}<\u002Fsc-raw-td><sc-raw-td>{{ r.length }}<\u002Fsc-raw-td><sc-raw-td>{{ r.level }}<\u002Fsc-raw-td><sc-raw-td>{{ r.learners }}<\u002Fsc-raw-td><sc-raw-td>{{ r.focus }}<\u002Fsc-raw-td><sc-raw-td>{{ r.kind }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n\n<!-- ASSESSED TP -->\n<div class=\"page-break\" id=\"sec7\">\n<div class=\"section-header\">Record of assessed teaching practice<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 12px;\">Rows below are pulled automatically from each TP Record as tutor feedback is submitted. <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>Length<\u002Fsc-raw-th><sc-raw-th>Level<\u002Fsc-raw-th><sc-raw-th>No. of learners<\u002Fsc-raw-th><sc-raw-th>Lesson focus<\u002Fsc-raw-th><sc-raw-th>Tutor assessment *<\u002Fsc-raw-th><sc-raw-th>Tutor initials<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-for list=\"{{ tpRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n<sc-raw-tr><sc-raw-td>{{ r.date }}<\u002Fsc-raw-td><sc-raw-td>{{ r.length }}<\u002Fsc-raw-td><sc-raw-td>{{ r.level }}<\u002Fsc-raw-td><sc-raw-td>{{ r.learners }}<\u002Fsc-raw-td><sc-raw-td>{{ r.focus }}<\u002Fsc-raw-td><sc-raw-td>{{ r.assessment }}<\u002Fsc-raw-td><sc-raw-td>{{ r.initials }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-table>\n<div style=\"font-size: 9px; color: oklch(51% 0.017 70); margin-top: 8px;\">* Candidates are reminded that tutor assessments relate to the standard of the lesson for that stage of the course, and do not represent a final assessment or grade.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- WRITTEN ASSIGNMENTS -->\n<div class=\"page-break\" id=\"sec8\">\n<div class=\"section-header\">Record of written assignments<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7; margin-bottom: 16px;\">\n<p>During the course, you are required to produce four assignments for assessment purposes. These are practical in nature and help to synthesise principles and practice from your teaching and learning on the course. You need to read the rubrics carefully, and address the questions set. Please note that two assignments can be conflated at the discretion of the centre, in which case both sections of the assignment will receive separate grades.<\u002Fp>\n<p>You will be given written feedback on each assignment, and a grade (Pass or Fail). Written assignments are marked for their content and their standard of English and you must pass in both areas to be awarded an overall pass for the assignment. If you are given a printed format for an assignment, please use it. A minimum of two of the assignments must be written in suitably formal, continuous prose. Written work can be handwritten (provided that it can be read easily) or typed. You will be required to confirm that the written work is your own.<\u002Fp>\n<p>In the event that any piece of work is considered unsatisfactory, you will have one opportunity to resubmit that piece of work during the course. If still unsatisfactory after resubmission, it will be graded as Fail.<\u002Fp>\n<p>It is possible to fail one written assignment and still pass the course, provided that you have demonstrated elsewhere in your coursework that you have met the criteria on which that assignment focused. However, if you fail one assignment, it is not possible to be awarded a Pass 'A' for a final course grade.<\u002Fp>\n<p>If you fail two written assignments, you cannot be awarded a Pass grade at the end of the course.<\u002Fp>\n<p>When you get an assignment back from your tutor, record the grade you have received in the appropriate boxes below.<\u002Fp>\n<\u002Fdiv>\n<sc-raw-table style=\"table-layout: fixed;\">\n<sc-raw-tr><sc-raw-th style=\"width: 26%;\">Title<\u002Fsc-raw-th><sc-raw-th style=\"width: 22%;\">Result<\u002Fsc-raw-th><sc-raw-th style=\"width: 38%;\">Candidate signature — I confirm that this is my own work<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-for list=\"{{ assignments }}\" as=\"a\" hint-placeholder-count=\"4\">\n<sc-raw-tr>\n<sc-raw-td>{{ a.title }}<\u002Fsc-raw-td>\n<sc-raw-td>{{ a.result }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fsc-raw-td>\n<sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%;\"><\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-table>\n<div style=\"font-size: 9px; color: oklch(51% 0.017 70); margin-top: 8px;\">Please note that severe penalties are applied if plagiarised work is detected. These will range from loss of marks to disqualification and a ban on re-entry for a period of up to three years.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- STAGE ONE -->\n<div class=\"page-break\" id=\"sec9\">\n<div class=\"section-num\">Section 9<\u002Fdiv>\n<div class=\"section-header\">Stage One progress record<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7; margin-bottom: 16px;\">This form will be completed by your tutor in the first third of the course. Some centres may hold a tutorial with you at the same time, but this is not obligatory. Having read and agreed with the summary, sign and date the report.<\u002Fdiv>\n\n<sc-if value=\"{{ isTutor }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"box\" style=\"margin-bottom: 16px; border-color: oklch(38% 0.072 195);\">\n<div style=\"font-weight: 700; margin-bottom: 6px; font-size: 11px;\">Tutor draft <span class=\"pulled-tag\">auto-drafted from tagged TP feedback<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 10px;\">Editable at your own pace — the trainee cannot see any of this until you release it.<\u002Fdiv>\n<div style=\"margin-bottom: 10px;\"><span style=\"font-weight: 700; font-size: 10px;\">Strengths (auto):<\u002Fspan> {{ stage1StrengthsAuto }}<\u002Fdiv>\n<div style=\"margin-bottom: 10px;\"><span style=\"font-weight: 700; font-size: 10px;\">Action plan (auto):<\u002Fspan> {{ stage1ActionAuto }}<\u002Fdiv>\n<div style=\"margin-bottom: 10px;\"><span style=\"font-weight: 700; font-size: 10px;\">Added by tutor:<\u002Fspan> {{ stage1TutorNote }}<\u002Fdiv>\n<div sc-camel-on-click=\"{{ toggleStage1Release }}\" class=\"act-btn\">{{ stage1ReleaseLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showStage1ToTrainee }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-bottom: 20px;\">\n<div style=\"font-weight: 700; margin-bottom: 6px;\">Strengths<\u002Fdiv>\n<div class=\"box\" style=\"min-height: 80px;\">{{ stage1StrengthsAuto }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-bottom: 20px;\">\n<div style=\"font-weight: 700; margin-bottom: 6px;\">Action plan for the next stage of the course<\u002Fdiv>\n<div class=\"box\" style=\"min-height: 80px;\">{{ stage1ActionAuto }} {{ stage1TutorNote }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 12px; display: flex; flex-direction: column; gap: 10px;\">\n<div style=\"display: flex; align-items: center; gap: 10px;\">Tutor's signature: <span style=\"font-weight: 700;\">{{ tutorSignatureName }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70);\">I have read and agree/do not agree with the above comments.<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px;\">Candidate's signature: <input type=\"text\" class=\"clean-line\" style=\"width: 220px;\"> &nbsp; Date: <input type=\"text\" class=\"clean-line\" style=\"width: 110px;\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hideStage1FromTrainee }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"lockbox\">Not released yet. Your tutor is preparing your Stage One record from your TP feedback so far — you'll be notified and asked to sign once it's ready.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<!-- STAGE TWO -->\n<div class=\"page-break\" id=\"sec10\">\n<div class=\"section-num\">Section 10 · Hours taught: {{ tpHoursLabel }}<\u002Fdiv>\n<div class=\"section-header\">Stage Two progress record<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7; margin-bottom: 16px;\">\n<p>With this record, a tutor will conduct a one-to-one tutorial with you.<\u002Fp>\n<p>Look at the list of criteria for teaching practice on the following pages. All of these criteria are taken from the CELTA Syllabus. In order to pass the course, you are required to demonstrate that you have met all of the criteria convincingly and consistently by the end of the course.<\u002Fp>\n<p>Before your tutorial, please read through your lesson plans, teaching practice feedback notes from tutors and any written work you have had marked and returned.<\u002Fp>\n<p>Then look at the list of criteria for teaching practice on the following pages (for further guidance on these criteria, see Appendix 1). In the column marked 'You', indicate the extent to which you feel you have demonstrated each of the criteria at this stage of the course by:<\u002Fp>\n<ul style=\"margin: 8px 0; padding-left: 20px;\">\n<li>Putting 'S+' for 'Above the Standard' expected at this stage of the course<\u002Fli>\n<li>Putting 'S' for 'Meets the Standard' expected at this stage of the course<\u002Fli>\n<li>Putting 'N' for 'Not to Standard' in relation to the standard expected at this stage and therefore needs more work in order to pass the course<\u002Fli>\n<li>Putting 'X' for 'Not Applicable' at this stage in the course because you have not yet focused on teaching or planning skills associated with that criterion.<\u002Fli>\n<\u002Ful>\n<p>Then complete the boxes marked 'You' with reference to the written assignments and any other areas you wish to discuss.<\u002Fp>\n<p>Choose the statement which you believe is the most appropriate description of your overall progress so far on the course (Overall Progress – Candidate's Assessment). Then, in the box provided, list the areas which you think you need to work on.<\u002Fp>\n<p>Either before, during or after the tutorial, your tutor will complete the column marked 'Tutor', indicating whether they agree with your self-assessment or not.<\u002Fp>\n<p>During the tutorial, you might like to take notes. Your progress to date will be discussed, as will any strategies to help you with any difficulties you are having.<\u002Fp>\n<p>The tutor will summarise key issues concerning your progress in the appropriate box.<\u002Fp>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isTrainee }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"box\" style=\"margin-bottom: 16px; background: {{ stage2NoticeBg }};\">\n<div style=\"font-size: 10px; line-height: 1.6;\">{{ stage2Notice }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"font-weight: 700; margin: 16px 0 2px 0; font-size: 11px;\">Planning for teaching<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 8px;\">Candidates can demonstrate their learning by:<\u002Fdiv>\n<div style=\"border: 1px solid oklch(88% 0.016 82); border-radius: 8px; overflow: hidden;\">\n<div style=\"display: grid; grid-template-columns: 1fr 130px 130px; padding: 8px 12px; background: oklch(96.4% 0.014 85); font-size: 9px; font-weight: 700; text-transform: uppercase; color: oklch(51% 0.017 70);\">\n<div>Criterion<\u002Fdiv><div style=\"text-align: center;\">You<\u002Fdiv><div style=\"text-align: center;\">Tutor<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ planningCriteria }}\" as=\"c\" hint-placeholder-count=\"14\">\n<sc-if value=\"{{ c.topic }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding: 8px 12px; border-top: 1px solid color-mix(in srgb, oklch(88% 0.016 82) 60%, transparent); background: oklch(96.4% 0.014 85); font-size: 9px; font-weight: 700; color: oklch(40% 0.03 75);\">{{ c.topic }}<\u002Fdiv><\u002Fsc-if>\n<div style=\"display: grid; grid-template-columns: 1fr 130px 130px; align-items: center; gap: 14px; padding: 8px 12px; border-top: 1px solid color-mix(in srgb, oklch(88% 0.016 82) 60%, transparent);\">\n<div style=\"font-size: 10px; color: oklch(23.5% 0.017 65);\"><span style=\"font-weight: 700; color: oklch(38% 0.072 195);\">{{ c.code }}<\u002Fspan> — {{ c.text }}<\u002Fdiv>\n<div class=\"pill-group\">\n<input type=\"radio\" data-group=\"planning\" data-rater=\"you\" name=\"p-{{ c.code }}-you\" id=\"p-{{ c.code }}-you-sp\" disabled=\"{{ stage2Locked }}\"><label for=\"p-{{ c.code }}-you-sp\" class=\"sp\">S+<\u002Flabel>\n<input type=\"radio\" data-group=\"planning\" data-rater=\"you\" name=\"p-{{ c.code }}-you\" id=\"p-{{ c.code }}-you-s\" disabled=\"{{ stage2Locked }}\"><label for=\"p-{{ c.code }}-you-s\" class=\"s\">S<\u002Flabel>\n<input type=\"radio\" data-group=\"planning\" data-rater=\"you\" name=\"p-{{ c.code }}-you\" id=\"p-{{ c.code }}-you-n\" disabled=\"{{ stage2Locked }}\"><label for=\"p-{{ c.code }}-you-n\" class=\"n\">N<\u002Flabel>\n<input type=\"radio\" data-group=\"planning\" data-rater=\"you\" name=\"p-{{ c.code }}-you\" id=\"p-{{ c.code }}-you-x\" disabled=\"{{ stage2Locked }}\"><label for=\"p-{{ c.code }}-you-x\" class=\"x\">X<\u002Flabel>\n<\u002Fdiv>\n<sc-if value=\"{{ stage2TutorVisible }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"badge\" style=\"background: color-mix(in oklab, oklch(38% 0.072 195) 14%, white); color: oklch(38% 0.072 195); text-align: center;\">{{ c.tutorRating }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ stage2TutorHidden }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size: 9px; color: oklch(51% 0.017 70); font-style: italic; text-align: center;\">Locked<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"font-weight: 700; margin: 20px 0 2px 0; font-size: 11px;\">Teaching practice<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 8px;\">Candidates can demonstrate their learning by:<\u002Fdiv>\n<div style=\"border: 1px solid oklch(88% 0.016 82); border-radius: 8px; overflow: hidden;\">\n<div style=\"display: grid; grid-template-columns: 1fr 130px 130px; padding: 8px 12px; background: oklch(96.4% 0.014 85); font-size: 9px; font-weight: 700; text-transform: uppercase; color: oklch(51% 0.017 70);\">\n<div>Criterion<\u002Fdiv><div style=\"text-align: center;\">You<\u002Fdiv><div style=\"text-align: center;\">Tutor<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ teachingCriteria }}\" as=\"c\" hint-placeholder-count=\"27\">\n<sc-if value=\"{{ c.topic }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding: 8px 12px; border-top: 1px solid color-mix(in srgb, oklch(88% 0.016 82) 60%, transparent); background: oklch(96.4% 0.014 85); font-size: 9px; font-weight: 700; color: oklch(40% 0.03 75);\">{{ c.topic }}<\u002Fdiv><\u002Fsc-if>\n<div style=\"display: grid; grid-template-columns: 1fr 130px 130px; align-items: center; gap: 14px; padding: 8px 12px; border-top: 1px solid color-mix(in srgb, oklch(88% 0.016 82) 60%, transparent);\">\n<div style=\"font-size: 10px; color: oklch(23.5% 0.017 65);\"><span style=\"font-weight: 700; color: oklch(38% 0.072 195);\">{{ c.code }}<\u002Fspan> — {{ c.text }}<\u002Fdiv>\n<div class=\"pill-group\">\n<input type=\"radio\" data-group=\"teaching\" data-rater=\"you\" name=\"t-{{ c.code }}-you\" id=\"t-{{ c.code }}-you-sp\" disabled=\"{{ stage2Locked }}\"><label for=\"t-{{ c.code }}-you-sp\" class=\"sp\">S+<\u002Flabel>\n<input type=\"radio\" data-group=\"teaching\" data-rater=\"you\" name=\"t-{{ c.code }}-you\" id=\"t-{{ c.code }}-you-s\" disabled=\"{{ stage2Locked }}\"><label for=\"t-{{ c.code }}-you-s\" class=\"s\">S<\u002Flabel>\n<input type=\"radio\" data-group=\"teaching\" data-rater=\"you\" name=\"t-{{ c.code }}-you\" id=\"t-{{ c.code }}-you-n\" disabled=\"{{ stage2Locked }}\"><label for=\"t-{{ c.code }}-you-n\" class=\"n\">N<\u002Flabel>\n<input type=\"radio\" data-group=\"teaching\" data-rater=\"you\" name=\"t-{{ c.code }}-you\" id=\"t-{{ c.code }}-you-x\" disabled=\"{{ stage2Locked }}\"><label for=\"t-{{ c.code }}-you-x\" class=\"x\">X<\u002Flabel>\n<\u002Fdiv>\n<sc-if value=\"{{ stage2TutorVisible }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"badge\" style=\"background: color-mix(in oklab, oklch(38% 0.072 195) 14%, white); color: oklch(38% 0.072 195); text-align: center;\">{{ c.tutorRating }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ stage2TutorHidden }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size: 9px; color: oklch(51% 0.017 70); font-style: italic; text-align: center;\">Locked<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"margin-top: 20px;\">\n<div style=\"font-weight: 700; margin-bottom: 4px; font-size: 11px;\">Written assignments:<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 6px;\">Consider the written assignments and identify any issues below, for discussion with your tutor.<\u002Fdiv>\n<sc-raw-table><sc-raw-tr><sc-raw-th style=\"width: 50%;\">YOU<\u002Fsc-raw-th><sc-raw-th style=\"width: 50%;\">TUTOR<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%; height: 50px;\" disabled=\"{{ stage2Locked }}\"><\u002Fsc-raw-td>\n<sc-raw-td>\n<sc-if value=\"{{ stage2TutorVisible }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 11px;\">{{ stage2TutorAssignmentsNote }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ stage2TutorHidden }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lockbox\" style=\"min-height: auto; padding: 8px;\">Hidden until you submit<\u002Fdiv><\u002Fsc-if>\n<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"margin-top: 16px;\">\n<div style=\"font-weight: 700; margin-bottom: 4px; font-size: 11px;\">Other:<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 6px;\">Consider any other issues you wish to discuss, e.g. problems with attendance, access to resources, coping with workload, need for support.<\u002Fdiv>\n<sc-raw-table><sc-raw-tr><sc-raw-th style=\"width: 50%;\">YOU<\u002Fsc-raw-th><sc-raw-th style=\"width: 50%;\">TUTOR<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-td><input type=\"text\" class=\"clean-line\" style=\"width: 100%; height: 50px;\" disabled=\"{{ stage2Locked }}\"><\u002Fsc-raw-td>\n<sc-raw-td>\n<sc-if value=\"{{ stage2TutorVisible }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 11px;\">{{ stage2TutorOtherNote }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ stage2TutorHidden }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lockbox\" style=\"min-height: auto; padding: 8px;\">Hidden until you submit<\u002Fdiv><\u002Fsc-if>\n<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n\n<div style=\"margin-top: 20px;\">\n<div style=\"font-weight: 700; margin-bottom: 6px; font-size: 11px;\">Overall progress — Candidate's assessment<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 6px;\">Choose one option:<\u002Fdiv>\n<sc-raw-select style=\"width: 100%;\" data-field=\"candidateOverall\" disabled=\"{{ stage2Locked }}\"><option value=\"\">Choose one…<\u002Foption><option>Above standard for this stage of the course<\u002Foption><option>To standard for this stage of the course<\u002Foption><option>Not to standard for this stage and needs more work in order to pass the course<\u002Foption><\u002Fsc-raw-select>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-top: 10px; margin-bottom: 6px;\">Indicate which areas you think you need to work on.<\u002Fdiv>\n<div class=\"box\" style=\"min-height: 70px;\"><\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isTrainee }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{ stage2ShowSubmit }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top: 16px;\" sc-camel-on-click=\"{{ submitStage2 }}\" class=\"act-btn\">Submit my self-assessment<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<div style=\"margin-top: 16px;\">\n<div style=\"font-weight: 700; margin-bottom: 6px; font-size: 11px;\">Overall progress — Tutor's assessment<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 6px;\">Choose one option:<\u002Fdiv>\n<sc-if value=\"{{ stage2TutorVisible }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12px; font-weight: 700;\">{{ stage2TutorOverall }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ stage2TutorHidden }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lockbox\">Hidden until you submit your self-assessment<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"margin-top: 20px;\">\n<div style=\"font-weight: 700; margin-bottom: 6px; font-size: 11px;\">Summary of tutorial and action points<\u002Fdiv>\n<sc-if value=\"{{ stage2TutorVisible }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"box\">{{ stage2Summary }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ stage2TutorHidden }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"lockbox\">Hidden until you submit your self-assessment<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"font-size: 12px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px;\">\n<div style=\"display: flex; align-items: center; gap: 10px;\">Tutor's signature: <span style=\"font-weight: 700;\">{{ tutorSignatureName }}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px;\">Candidate's signature: <input type=\"text\" class=\"clean-line\" style=\"width: 220px;\" disabled=\"{{ stage2Locked }}\"> &nbsp; Date: <input type=\"text\" class=\"clean-line\" style=\"width: 110px;\" disabled=\"{{ stage2Locked }}\"><\u002Fdiv>\n<div style=\"font-size: 9px; color: oklch(51% 0.017 70);\">Please choose if you agree with the record and sign it after the tutor has completed the box above.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- STAGE THREE -->\n<div class=\"page-break\" id=\"sec11\">\n<div class=\"section-num\">Section 11<\u002Fdiv>\n<div class=\"section-header\">Stage Three progress record<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7; margin-bottom: 12px;\">This record must be completed by tutors in the final third of the course for all candidates who: a) were not to standard at Stage 2; b) were at standard at Stage 2 but are not making the expected progress in the second half of the course; c) were above standard at Stage 2 but are not making the expected progress in the second half of the course. A tutorial must be given and the whole record completed.<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7; margin-bottom: 16px;\">The tutor will use the following grades: 'S+' for 'Above the Standard' expected at this stage of the course; 'S' for 'Meets the Standard' expected at this stage of the course; 'N' for 'Not to standard' in relation to the standard expected at this stage and therefore needs more work in order to pass the course.<\u002Fdiv>\n\n<div class=\"box\" style=\"margin-bottom: 16px;\">\n<div style=\"font-weight: 700; font-size: 11px; margin-bottom: 6px;\">Auto-generated report <span class=\"pulled-tag\">pulled, every trainee gets one<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7;\">Assessed teaching: {{ tpHoursLabel }} of 6.00 hrs · Criteria met: {{ stage3CriteriaMetPct }} · Assignments: {{ assignSummaryLabel }} · Attendance: {{ attendancePctLabel }}<\u002Fdiv>\n<div style=\"margin-top: 8px; font-size: 10px; font-weight: 700; color: {{ stage3TriggerColor }};\">{{ stage3TriggerLabel }}<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isTutor }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ toggleStage3Release }}\" class=\"act-btn\" style=\"margin-bottom: 16px;\">{{ stage3ReleaseLabel }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ stage3Released }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top: 20px;\">\n<div style=\"font-weight: 700; margin-bottom: 4px; font-size: 11px;\">Written assignments:<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 6px;\">Tutor's comments on issues relating to written assignments.<\u002Fdiv>\n<div class=\"box\">{{ stage3AssignmentsNote }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 16px;\">\n<div style=\"font-weight: 700; margin-bottom: 4px; font-size: 11px;\">Overall progress — Tutor's assessment<\u002Fdiv>\n<div style=\"font-size: 12px; font-weight: 700;\">{{ stage3Overall }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 20px;\">\n<div style=\"font-weight: 700; margin-bottom: 6px; font-size: 11px;\">Summary of tutorial and action points<\u002Fdiv>\n<div cla
