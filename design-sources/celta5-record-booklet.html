ss=\"box\">{{ stage3Summary }} <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 12px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px;\">\n<div style=\"display: flex; align-items: center; gap: 10px;\">Tutor's signature: <span style=\"font-weight: 700;\">{{ tutorSignatureName }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70);\">I have read and agree/do not agree with the summarising comments.<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px;\">Candidate's signature: <input type=\"text\" class=\"clean-line\" style=\"width: 220px;\"> &nbsp; Date: <input type=\"text\" class=\"clean-line\" style=\"width: 110px;\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ stage3Hidden }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"lockbox\">Not released yet. Your Stage Three report has been generated but your tutor hasn't submitted it to you.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<!-- FINAL DAY -->\n<div class=\"page-break\" id=\"sec12\">\n<div class=\"section-num\">Section 12<\u002Fdiv>\n<div class=\"section-header\">To be completed on the final day of the course<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 12px;\">Each item below is checked automatically against the pulled records — nothing to verify by hand. <span class=\"pulled-tag\">pulled<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;\">\n<sc-for list=\"{{ finalChecklist }}\" as=\"f\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; border: 1px solid {{ f.border }}; background: {{ f.bg }};\">\n<div class=\"badge\" style=\"background: {{ f.dotBg }}; color: white;\">{{ f.mark }}<\u002Fdiv>\n<div style=\"font-size: 11px; color: oklch(23.5% 0.017 65);\">{{ f.text }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size: 12px; display: flex; flex-direction: column; gap: 10px;\">\n<div style=\"display: flex; align-items: center; gap: 10px;\">Candidate's signature: <input id=\"final-candidate-sig\" type=\"text\" class=\"clean-line\" style=\"width: 220px;\"> &nbsp; Date: <input type=\"text\" class=\"clean-line\" style=\"width: 110px;\"><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px;\">Accepted by tutor: <input id=\"final-tutor-sig\" type=\"text\" class=\"clean-line\" style=\"width: 220px;\"> &nbsp; Date: <input type=\"text\" class=\"clean-line\" style=\"width: 110px;\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- GRADE REVIEW INFO -->\n<div style=\"padding-bottom: 20px;\">\n<div class=\"section-header\">Information for the CELTA grade review — tutor comments on action points detailed in Stage Three progress record<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); line-height: 1.7; margin-bottom: 16px;\">This box is to be completed for all candidates whose portfolios are submitted to Cambridge English. (See CELTA Administration Handbook for details of portfolios to be submitted.) Please state whether the candidate did or did not demonstrate effectiveness in the areas identified, making reference to feedback to the candidate in final lessons and/or written assignments, as appropriate.<\u002Fdiv>\n<div class=\"box\" style=\"min-height: 100px;\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- APPENDIX 1 -->\n<div id=\"sec13\" style=\"padding-top: 30px; border-top: 2px solid oklch(88% 0.016 82); margin-top: 20px;\">\n<div class=\"section-header\">Appendix 1<\u002Fdiv>\n<div style=\"font-size: 10px; line-height: 1.7;\">\n<p>Notes to help you prepare for tutorials: the following are examples of what you need to do to show that you have achieved the assessment criteria.<\u002Fp>\n<p style=\"font-weight: 700;\">• prepare and plan for the effective teaching of adult ESOL learners by:<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 14px;\">TOPIC 4 – PLANNING AND RESOURCES FOR DIFFERENT TEACHING CONTEXTS<\u002Fp>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4a<\u002Fspan> identifying and stating appropriate aims/outcomes for individual lessons<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>write clear aims<\u002Fli><li>know the difference between main and subsidiary aims<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4b<\u002Fspan> ordering activities so that they achieve lesson aims<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>sequence the activities/stages of a language focus lesson in one of the ways you have learnt on the course and so that aims are achieved<\u002Fli><li>sequence the activities/stages of a skills lesson in one of the ways you have learnt on the course so that aims are achieved<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4c<\u002Fspan> selecting, adapting or designing materials, activities, resources and technical aids appropriate for the lesson<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>choose materials, tasks and activities from coursebooks and other sources that meet your aims<\u002Fli><li>create extra materials and tasks when appropriate<\u002Fli><li>adapt texts so they are easier or more relevant for your learners<\u002Fli><li>adapt tasks so that they present either more or less challenge for learners<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4d<\u002Fspan> presenting the materials for classroom use with a professional appearance, and with regard to copyright requirements<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>make sure your handouts are legible for students<\u002Fli><li>remember to put a copyright label on photocopies<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4e<\u002Fspan> describing the procedure of the lesson in sufficient detail<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>indicate what the learners will do so it is clear to someone reading the plan<\u002Fli><li>indicate what the teacher will do so it is clear to someone reading the plan<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4f<\u002Fspan> including interaction patterns appropriate for the materials and activities used in the lesson<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>identify and state interaction patterns for each stage of the lesson in the procedure of the lesson plan, for example teacher-student, student-student, students work in pairs, students work in groups<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4g<\u002Fspan> ensuring balance, variety and a communicative focus in materials, tasks and activities<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>ensure that there is a balance between teacher input and student practice<\u002Fli><li>ensure that there is a balance between teacher-led activity and student-centred activity<\u002Fli><li>ensure that there is variety in terms of activity type in the lesson, for example, oral as well as written practice, listening as well as oral practice<\u002Fli><li>ensure that there is variety in terms of materials, tasks and activities in the lesson<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4h<\u002Fspan> allocating appropriate timing for different stages in the lessons<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>divide the procedure into clear stages in your lesson plan and indicate how long you think each stage will take<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4i<\u002Fspan> analysing language with attention to form, meaning and phonology and using correct terminology<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>show that you can analyse language in detail for any language focused on in a lesson<\u002Fli><li>show how the form will be clarified on the board<\u002Fli><li>indicate how the concept will be established and checked<\u002Fli><li>indicate significant aspects of pronunciation relating to this language<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4j<\u002Fspan> anticipating potential difficulties with language, materials and learners<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>list on the lesson plan cover sheet any potential problems for learners with language: form, meaning, pronunciation<\u002Fli><li>list on the lesson plan cover sheet any potential problems for learners with tasks<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4k<\u002Fspan> suggesting solutions to anticipated problems<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>show on the lesson plan coversheet how you plan to deal with potential problems with language and tasks<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4l<\u002Fspan> using terminology that relates to language skills and subskills correctly<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>write aims for skills lessons which relate to developing receptive and productive skills and subskills – e.g. developing skim reading skills, listening for gist<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4m<\u002Fspan> working constructively with colleagues in the planning of teaching practice sessions<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>liaise and co-operate willingly and constructively with your peers in supervised lesson preparation<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">4n<\u002Fspan> reflecting on and evaluating their plans in light of the learning process and suggesting improvements for future plans<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>discuss and note the strengths and weaknesses of your lesson plan after your lesson<\u002Fli><li>address weak areas in the planning of future TP lessons<\u002Fli><\u002Ful>\n<p style=\"font-weight: 700; margin-top: 18px;\">• demonstrate professional competence in the classroom by:<\u002Fp>\n<p style=\"font-weight: 700; margin-top: 14px;\">TOPIC 1 – LEARNERS AND TEACHERS AND THE TEACHING AND LEARNING CONTEXT<\u002Fp>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">1a<\u002Fspan> teaching a class with an awareness of the needs and interests of the learner group<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>find out from learners and peers about the needs and interests of learners<\u002Fli><li>use this information for selecting and adapting materials and activity types where appropriate<\u002Fli><li>use this information when setting up pair and group work and dealing with learners in open class where appropriate<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">1b<\u002Fspan> teaching a class with an awareness of learning preferences and cultural factors that may affect learning<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>find out from learners and peers about the cultural backgrounds of learners<\u002Fli><li>use this information for selecting and adapting materials and activity types where appropriate<\u002Fli><li>use this information when setting up pair and group work and dealing with learners in open class where appropriate<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">1c<\u002Fspan> acknowledging, when necessary, learners' backgrounds and previous learning experiences<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>find out from learners and peers about the learning backgrounds of learners<\u002Fli><li>find out about the linguistic strengths and weaknesses of learners<\u002Fli><li>use this information for selecting materials and activity types where appropriate<\u002Fli><li>use this information when setting up pair and group work and dealing with learners in open class where appropriate<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">1d<\u002Fspan> establishing good rapport with learners and ensuring they are fully involved in learning activities<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>build a positive classroom atmosphere<\u002Fli><li>interact naturally with learners before, during and after the lesson<\u002Fli><li>maintain eye contact<\u002Fli><li>ensure that learners are involved in the lesson during teacher-fronted and learner-centred stages of the lesson<\u002Fli><\u002Ful>\n<p style=\"font-weight: 700; margin-top: 14px;\">TOPIC 2 – LANGUAGE ANALYSIS AND AWARENESS<\u002Fp>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">2a<\u002Fspan> adjusting their own use of language in the classroom according to the learner group and the context<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>use comprehensible language to give instructions and when explaining<\u002Fli><li>keep your simplified language natural<\u002Fli><li>allow learners opportunity to speak by keeping teacher talk to an appropriate level<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">2b<\u002Fspan> identifying errors and sensitively correcting learners' oral and written language<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>show an awareness of student errors<\u002Fli><li>correct learners' language sensitively during controlled oral practice activities<\u002Fli><li>give feedback on oral errors after a communicative activity<\u002Fli><li>correct learners' language sensitively during controlled written practice activities<\u002Fli><li>correct freer written tasks set in class or set for homework<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">2c<\u002Fspan> providing clear contexts and a communicative focus for language<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>provide a context for language by means of text, situation or task using visual aids and realia as appropriate<\u002Fli><li>ensure there is a clear link between the context and the target language<\u002Fli><li>ensure that the context provides learners with sufficient opportunity for communicative practice<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">2d<\u002Fspan> providing accurate and appropriate models of oral and written language in the classroom<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>choose natural examples of language from context<\u002Fli><li>ensure new language models are natural and accurate when drilling<\u002Fli><li>highlight the target language clearly<\u002Fli><li>ensure language used on the board and on worksheets is correct in terms of spelling and punctuation<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">2e<\u002Fspan> focusing on language items in the classroom by clarifying relevant aspects of meaning and form (including phonology) to an appropriate degree of depth<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>clarify the meaning of language in language-based lessons by using one of the ways you have learnt on the course, e.g. concept questions, timelines or a learner-centred task<\u002Fli><li>clarify the form of language in language-based lessons by using one of the ways you have learnt on the course, e.g. using the board or a learner-centred task<\u002Fli><li>clarify the pronunciation of language in language-based lessons in one of the ways you have learnt on the course, e.g. finger highlighting, highlighting on the board<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">2f<\u002Fspan> showing awareness of differences in style and register<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>show awareness of formal, neutral and informal language<\u002Fli><li>show awareness of how language changes according to the different contexts in which it is used<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">2g<\u002Fspan> providing appropriate practice of language items<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>provide as much practice in context as possible<\u002Fli><li>ensure the practice is appropriate to the target language<\u002Fli><li>stage practice activities logically<\u002Fli><\u002Ful>\n<p style=\"font-weight: 700; margin-top: 14px;\">TOPIC 3 – LANGUAGE SKILLS: READING, LISTENING, SPEAKING AND WRITING<\u002Fp>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">3a<\u002Fspan> helping learners to understand reading and listening texts<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>follow teaching procedures you have learnt on the course for a receptive skills-based lesson<\u002Fli><li>ensure an appropriate focus on developing receptive skills and subskills<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">3b<\u002Fspan> helping learners to produce oral and written language<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>follow teaching procedures you have learnt on the course for a speaking skills-based lesson<\u002Fli><li>ensure an appropriate focus on developing speaking skills and subskills<\u002Fli><li>ensure a communicative focus in speaking activities<\u002Fli><li>provide learners with opportunities to practise writing in language-focused and skills lessons<\u002Fli><li>ensure an appropriate focus on practising writing skills and subskills<\u002Fli><\u002Ful>\n<p style=\"font-weight: 700; margin-top: 14px;\">TOPIC 5 – DEVELOPING TEACHING SKILLS AND PROFESSIONALISM<\u002Fp>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5a<\u002Fspan> arranging the classroom appropriately for teaching and learning, bearing in mind safety regulations of the institution<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>arrange the classroom (online or face-to-face) to suit different types of activity<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5b<\u002Fspan> setting up and managing whole class and/or group or individual activities as appropriate<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>give clear instructions for pair, group, individual and plenary work<\u002Fli><li>organise the learners in pair, group, individual and plenary work<\u002Fli><li>give an example or demonstration of the task if appropriate<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5c<\u002Fspan> selecting appropriate teaching techniques in relation to the content of the lesson<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>recognise different lesson types (skills based, language focus based) and follow teaching procedures you have learnt on the course to achieve the aims of different types of lesson<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5d<\u002Fspan> managing the learning process in such a way that lesson aims are achieved<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>ensure that the activities and tasks help achieve the aim of the lesson<\u002Fli><li>ensure there is an appropriate balance between teacher-fronted and learner-centred activities<\u002Fli><li>be sufficiently directive when appropriate<\u002Fli><li>keep a low profile when appropriate<\u002Fli><li>know when to intervene or not<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5e<\u002Fspan> making use of materials, resources and technical aids in such a way that they enhance learning<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>use games, puzzles, pictures, realia, audio material to help learners learn and to provide practice<\u002Fli><li>use technical aids (e.g., apps, video, projector or interactive whiteboard) so that they are clear to all<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5f<\u002Fspan> using appropriate means to make instructions for tasks and activities clear to learners<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>use simple language to give instructions for tasks and activities<\u002Fli><li>give instructions at an appropriate stage of the lesson<\u002Fli><li>give an example or demonstration of the task if appropriate<\u002Fli><li>check that learners have understood instructions for tasks and activities<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5g<\u002Fspan> using a range of questions effectively for the purpose of elicitation and checking of understanding<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>use questions for\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>setting context<\u002Fli><li>building up information<\u002Fli><li>assessing learners' prior knowledge<\u002Fli><li>checking meaning of language items<\u002Fli><li>checking understanding of instructions<\u002Fli><\u002Ful>\n<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5h<\u002Fspan> providing learners with appropriate feedback on tasks and activities<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>give learners time to check the answers to tasks in pairs/groups<\u002Fli><li>provide feedback on both the content of activities and the language used in them<\u002Fli><li>use a variety of techniques in order to give feedback on activities<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5i<\u002Fspan> maintaining an appropriate learning pace in relation to materials, tasks and activities<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>keep teacher language and explanation to a minimum<\u002Fli><li>allow time for learners to complete tasks without allowing activities to go on too long<\u002Fli><li>be aware of when learners are ready to move on to the next stage of the lesson<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5j<\u002Fspan> monitoring learners appropriately in relation to the task or activity<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>listen to learners attentively but unobtrusively during stages of the lesson<\u002Fli><li>know when to intervene in learner-centred activities<\u002Fli><li>ensure that your attention is spread evenly amongst the learners<\u002Fli><li>know when to move on to the next stage of the lesson<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5k<\u002Fspan> beginning and finishing lessons on time and, if necessary, making any relevant regulations pertaining to the teaching institution clear to learners<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>ensure that you are in the classroom in good time to begin your lesson on time<\u002Fli><li>ensure that your materials are prepared in good time to begin your lesson on time<\u002Fli><li>ensure that you finish your lesson on time and that you do not exceed your allotted time<\u002Fli><li>ensure learners are aware of start and finish times as required<\u002Fli><li>ensure you pass on any relevant administrative information to learners when required<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5l<\u002Fspan> maintaining accurate and up-to-date records in their portfolio<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>update your CELTA 5 booklet each day<\u002Fli><li>file TP and assignment documents (in the correct order) in your portfolio each day<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5m<\u002Fspan> noting their own teaching strengths and weaknesses in different teaching situations in light of feedback from learners, teachers and teacher educators<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>complete a written self-evaluation for each TP lesson noting your strengths and weaknesses<\u002Fli><li>incorporate feedback from others in future TP lessons<\u002Fli><\u002Ful>\n<p style=\"margin: 10px 0 2px;\"><span style=\"font-weight: 700;\">5n<\u002Fspan> participating in and responding to feedback<\u002Fp>\n<ul style=\"margin: 2px 0; padding-left: 20px;\"><li>evaluate your own lessons and your colleagues' lessons critically but constructively in TP feedback<\u002Fli><li>suggest strategies for improving weak areas<\u002Fli><li>respond positively to comments, suggestions and criticism made by peers and tutors on your lessons<\u002Fli><li>make constructive suggestions on your peers' teaching<\u002Fli><\u002Ful>\n<p style=\"margin-top: 16px; color: oklch(51% 0.017 70);\">This appendix is an adaptation of a document devised by Craig Thaine at Languages International, Auckland and Graeme Holdaway at Waiariki Institute of Technology, Rotorua, New Zealand. In July 2021, it was minimally modified further to account for online CELTA.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- APPENDIX 2 -->\n<div id=\"sec14\" style=\"padding-top: 30px; border-top: 2px solid oklch(88% 0.016 82); margin-top: 30px; padding-bottom: 20px;\">\n<div class=\"section-header\">Appendix 2 — CELTA Performance Descriptors<\u002Fdiv>\n<div style=\"font-size: 10px; color: oklch(51% 0.017 70); margin-bottom: 16px; line-height: 1.7;\">The CELTA performance descriptors are for use at the end of the course to determine final recommended grades. By the end of the course, candidates' performance must match ALL of the descriptors at a particular passing grade in order to achieve that grade.<\u002Fdiv>\n<sc-raw-table style=\"font-size: 9px;\">\n<sc-raw-tr><sc-raw-th style=\"width: 14%;\">&nbsp;<\u002Fsc-raw-th><sc-raw-th>Pass<\u002Fsc-raw-th><sc-raw-th>Pass B<\u002Fsc-raw-th><sc-raw-th>Pass A<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Planning<\u002Fsc-raw-td><sc-raw-td>Candidates can plan effectively with guidance. They can analyse target language adequately and generally select appropriate resources and tasks for successful language and language skills development.<\u002Fsc-raw-td><sc-raw-td>Candidates can plan effectively with some guidance. They can analyse target language well and select appropriate resources and tasks for successful language and language skills development.<\u002Fsc-raw-td><sc-raw-td>Candidates can plan effectively with minimal guidance. They can analyse target language thoroughly and select appropriate resources and tasks for successful language and language skills development.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Teaching<\u002Fsc-raw-td><sc-raw-td>Candidates can generally deliver effective language and skills lessons, using a variety of classroom teaching techniques with a degree of success.<\u002Fsc-raw-td><sc-raw-td>Candidates can deliver effective language and skills lessons, using a variety of classroom teaching techniques successfully.<\u002Fsc-raw-td><sc-raw-td>Candidates can deliver effective language and skills lessons, using a variety of classroom teaching techniques successfully.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Awareness of learners<\u002Fsc-raw-td><sc-raw-td>Candidates show some awareness of learners and some ability to respond so that learners benefit from the lessons.<\u002Fsc-raw-td><sc-raw-td>Candidates show good awareness of learners and can respond so that learners benefit from the lessons.<\u002Fsc-raw-td><sc-raw-td>Candidates show very good awareness of learners and can respond so that learners benefit from the lessons.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Reflection<\u002Fsc-raw-td><sc-raw-td>Candidates can reflect on some key strengths and weaknesses and generally use these reflections to develop their teaching skills.<\u002Fsc-raw-td><sc-raw-td>Candidates can reflect on key strengths and weaknesses and generally use these reflections to develop their teaching skills.<\u002Fsc-raw-td><sc-raw-td>Candidates can reflect on key strengths and weaknesses and consistently use these reflections to develop their teaching skills.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-weight: 700;\">Overall<\u002Fsc-raw-td><sc-raw-td>Candidates' planning and teaching show satisfactory understanding of English language learning and teaching processes at CELTA level.<\u002Fsc-raw-td><sc-raw-td>Candidates' planning and teaching show good understanding of English language learning and teaching processes at CELTA level.<\u002Fsc-raw-td><sc-raw-td>Candidates' planning and teaching show excellent understanding of English language learning and teaching processes at CELTA level.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"font-size: 10px; margin-top: 10px;\">All CELTA assessment criteria are achieved and requirements for written work are met.<\u002Fdiv>\n<div style=\"margin-top: 12px; padding: 12px; background: oklch(97% 0.016 85); border: 1px solid oklch(83% 0.024 85); border-radius: 8px; font-size: 10px;\"><span style=\"font-weight: 700;\">Fail<\u002Fspan> — Candidates' performance does not match all of the Pass descriptors. Some CELTA assessment criteria are not achieved and/or requirements for written work are not met.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;900px&quot;}}\">\n// Fallback shown only until celta-trainee-data.js finishes loading.\nconst FALLBACK = {\n  tutorName: 'Ramy Sakr',\n  attendance: { courseHours: 120, hoursAttended: 108 },\n  observations: {\n    hours: 4.75,\n    rows: [\n      { date: '2024-01-15', length: '45', level: 'Upper-Int (B2)', learners: '8', focus: 'Grammar and speaking', kind: 'Experienced teacher' },\n      { date: '2024-01-22', length: '45', level: 'Elementary (A2)', learners: '9', focus: 'Reading for gist', kind: 'Filmed' },\n      { date: '2024-02-02', length: '60', level: 'Intermediate (B1)', learners: '11', focus: 'Speaking \\u2014 transactional role play', kind: 'Experienced teacher' },\n      { date: '2024-02-09', length: '45', level: 'Pre-Int (A2+)', learners: '10', focus: 'Listening for specific detail', kind: 'Filmed' },\n      { date: '2024-02-14', length: '45', level: 'Elementary (A2)', learners: '12', focus: 'TP2 \\u2014 instructions', kind: 'Peer' },\n    ],\n  },\n  tp: {\n    hours: 6.0,\n    rows: [\n      { date: '2024-01-18', length: '45', level: 'Elementary (A2)', learners: '9', focus: 'Present simple for routines', assessment: 'To standard', initials: 'JH' },\n      { date: '2024-01-25', length: '45', level: 'Elementary (A2)', learners: '9', focus: 'Reading for gist', assessment: 'To standard', initials: 'JH' },\n      { date: '2024-02-01', length: '45', level: 'Pre-Int (A2+)', learners: '11', focus: 'Going to for future plans', assessment: 'Above standard', initials: 'RS' },\n      { date: '2024-02-08', length: '45', level: 'Pre-Int (A2+)', learners: '11', focus: 'Giving instructions clearly', assessment: 'To standard', initials: 'RS' },\n    ],\n  },\n  assignments: [\n    { title: 'Focus on the learner', result: 'Pass 1st submission' },\n    { title: 'Language related tasks', result: 'Pass 1st submission' },\n    { title: 'Skills assignment', result: 'Pass 2nd submission' },\n    { title: 'Lessons from the classroom', result: '\\
