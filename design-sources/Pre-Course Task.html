document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle>\n  body { margin: 0; background: oklch(92.5% 0.012 85); }\n  a { color: oklch(38% 0.072 195); text-decoration: none; }\n  a:hover { color: oklch(23.5% 0.017 65); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: Karla, Helvetica, sans-serif; padding: 56px; display: flex; flex-direction: column; gap: 44px; width: 1560px; box-sizing: border-box;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 960px;\">\n    <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(51% 0.017 70);\">Connect · before day one · Cambridge Pre-Course Task 2018<\u002Fdiv>\n    <div style=\"font-family: Newsreader, Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1.15; color: oklch(23.5% 0.017 65);\">The task everyone does on paper, and nobody reads before day one.<\u002Fdiv>\n    <div style=\"font-size: 14px; line-height: 1.6; color: oklch(51% 0.017 70); text-wrap: pretty;\">Five sections mapped to the five CELTA units, completed before the course and handed in at the start. Cambridge is explicit that it is not graded and not counted as coursework — so the value is entirely in what it tells a tutor on day one, which is exactly what a paper sheet in a folder cannot deliver.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"2a\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"display: flex; align-items: center; gap: 10px;\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 5px; background: oklch(23.5% 0.017 65); color: oklch(93% 0.024 80);\">2a<\u002Fdiv>\n      <div style=\"font-size: 13px; font-weight: 600; color: oklch(23.5% 0.017 65);\">The centre supplement — Section 6<\u002Fdiv>\n      <div style=\"font-size: 12px; color: oklch(51% 0.017 70);\">teaching online and the use of L1, in Cambridge's shape but clearly not Cambridge's<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 1440px; box-sizing: border-box; background: oklch(96.4% 0.014 85); border: 1px solid oklch(88% 0.016 82); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 18px;\">\n\n      <div style=\"display: flex; align-items: flex-start; gap: 11px; padding: 13px 15px; border-radius: 6px; background: color-mix(in oklab, oklch(60% 0.11 70) 10%, oklch(93% 0.024 80)); border: 1px solid color-mix(in oklab, oklch(60% 0.11 70) 28%, transparent);\">\n        <div style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(60% 0.11 70); margin-top: 6px; flex: none;\"><\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.65; color: oklch(23.5% 0.017 65); text-wrap: pretty;\">Cambridge's task is the 2018 edition and the syllabus is the July 2021 one. Nothing in the five sections mentions teaching in virtual classrooms or the use of L1, and on any course with an online element part of a candidate's teaching practice will be on Zoom. This is a centre supplement, not a replacement — Cambridge's five sections are untouched and this sits after them as Section 6, in the same shape: a short read, then a task, ungraded, handed in on day one.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start;\">\n\n        <div style=\"background: oklch(93% 0.024 80); border: 1px solid oklch(88% 0.016 82); border-radius: 6px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid oklch(88% 0.016 82);\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(51% 0.017 70);\">Section 6 · Meridian English Centre · not part of the Cambridge task<\u002Fdiv>\n              <div style=\"font-family: Newsreader, Georgia, serif; font-size: 22px; font-weight: 600; color: oklch(23.5% 0.017 65);\">Teaching online, and the use of L1<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 11px; color: oklch(51% 0.017 70); text-align: right; line-height: 1.5; flex: none;\">{{ supCount }}<br>Ungraded<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n            <div style=\"font-size: 11px; font-weight: 600; color: oklch(51% 0.017 70);\">Course mode — what the candidate is actually sent<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 7px;\">\n              <sc-for list=\"{{ modeTabs }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ m.pick }}\" style=\"height: 42px; padding: 0 14px; border-radius: 6px; border: 1px solid {{ m.border }}; background: {{ m.bg }}; display: flex; flex-direction: column; justify-content: center; gap: 1px; cursor: pointer;\">\n                  <div style=\"font-size: 12px; font-weight: 700; color: {{ m.ink }};\">{{ m.label }}<\u002Fdiv>\n                  <div style=\"font-size: 10px; color: oklch(51% 0.017 70);\">{{ m.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; gap: 7px;\">\n            <sc-for list=\"{{ supTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ t.pick }}\" style=\"height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid {{ t.border }}; background: {{ t.bg }}; display: flex; align-items: center; font-size: 12px; font-weight: 600; color: {{ t.ink }}; cursor: pointer;\">{{ t.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n            <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(51% 0.017 70);\">{{ part.letter }}<\u002Fdiv>\n            <div style=\"font-family: Newsreader, Georgia, serif; font-size: 19px; font-weight: 600; color: oklch(23.5% 0.017 65);\">{{ part.title }}<\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.65; color: oklch(51% 0.017 70); text-wrap: pretty;\">{{ part.intro }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <sc-for list=\"{{ part.tasks }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 15px 16px; border-radius: 6px; background: oklch(96.4% 0.014 85); border: 1px solid oklch(88% 0.016 82);\">\n                <div style=\"font-size: 12px; font-weight: 700; color: oklch(23.5% 0.017 65);\">{{ t.label }}<\u002Fdiv>\n                <sc-for list=\"{{ t.questions }}\" as=\"q\" hint-placeholder-count=\"2\">\n                  <div style=\"display: flex; align-items: flex-start; gap: 9px;\">\n                    <div style=\"font-size: 12px; color: oklch(51% 0.017 70); flex: none; width: 13px;\">{{ q.n }}<\u002Fdiv>\n                    <div style=\"font-size: 12.5px; line-height: 1.6; color: oklch(23.5% 0.017 65); text-wrap: pretty;\">{{ q.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"min-height: 54px; border: 1px solid oklch(88% 0.016 82); border-radius: 5px; background: oklch(93% 0.024 80); padding: 9px 11px; font-size: 12px; line-height: 1.55; color: {{ t.answerInk }}; font-style: {{ t.answerStyle }};\">{{ t.answer }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <sc-for list=\"{{ supNotes }}\" as=\"n\" hint-placeholder-count=\"4\">\n            <div style=\"background: oklch(93% 0.024 80); border: 1px solid {{ n.border }}; border-radius: 6px; padding: 15px 17px; display: flex; flex-direction: column; gap: 6px;\">\n              <div style=\"font-size: 12px; font-weight: 700; color: {{ n.labelInk }};\">{{ n.label }}<\u002Fdiv>\n              <div style=\"font-size: 12px; line-height: 1.6; color: oklch(23.5% 0.017 65); text-wrap: pretty;\">{{ n.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1a -->\n  <div id=\"1a\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"display: flex; align-items: center; gap: 10px;\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 5px; background: oklch(23.5% 0.017 65); color: oklch(93% 0.024 80);\">1a<\u002Fdiv>\n      <div style=\"font-size: 13px; font-weight: 600; color: oklch(23.5% 0.017 65);\">Candidate — the workspace before the course starts<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 1440px; box-sizing: border-box; background: oklch(96.4% 0.014 85); border: 1px solid oklch(88% 0.016 82); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(51% 0.017 70);\">Your course starts in 9 days · 6 Nov<\u002Fdiv>\n          <div style=\"font-family: Newsreader, Georgia, serif; font-size: 23px; font-weight: 600; color: oklch(23.5% 0.017 65);\">Pre-course task<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px;\">\n          <div style=\"display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 999px; background: oklch(93.5% 0.012 85); color: oklch(51% 0.017 70); font-size: 12px; font-weight: 600;\">Not graded<\u002Fdiv>\n          <div style=\"font-size: 12px; color: oklch(51% 0.017 70);\">Hand in on the first morning<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; border-radius: 6px; background: color-mix(in oklab, oklch(38% 0.072 195) 8%, oklch(93% 0.024 80)); border: 1px solid color-mix(in oklab, oklch(38% 0.072 195) 20%, transparent);\">\n        <div style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(38% 0.072 195); margin-top: 6px; flex: none;\"><\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.6; color: oklch(23.5% 0.017 65);\">It will not be graded or taken into account as part of your coursework. Work through it in several sittings rather than one — that is Cambridge's own advice, and the grammar section rewards it.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 286px 1fr; gap: 18px; align-items: start;\">\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"background: oklch(93% 0.024 80); border: 1px solid oklch(88% 0.016 82); border-radius: 6px; padding: 14px 0; display: flex; flex-direction: column; gap: 2px;\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 11px;\">\n              <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(51% 0.017 70);\">Sections<\u002Fdiv>\n              <div style=\"font-size: 11px; color: oklch(51% 0.017 70); font-variant-numeric: tabular-nums;\">14 of 31 done<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ s.pick }}\" style=\"padding: 10px 16px  0.016 82) 55%, transparent)';\n\nconst SECTIONS = [\n  { unit: 'Unit 1', title: 'Learners and teachers, and the teaching and learning context', done: 5, total: 5 },\n  { unit: 'Unit 2', title: 'Language analysis and awareness', done: 9, total: 16 },\n  { unit: 'Unit 3', title: 'Language skills: reading, listening, speaking and writing', done: 0, total: 5 },\n  { unit: 'Unit 4', title: 'Planning and resources', done: 0, total: 2 },\n  { unit: 'Unit 5', title: 'Developing teaching skills and professionalism', done: 0, total: 3 },\n];\n\nclass Component extends DCLogic {\n  state = { section: 1 };\n\n  renderVals() {\n    const { section } = this.state;\n    const mode = this.state.mode || 'mixed';\n    const part = this.state.part || 'online';\n    const INTRO = {\n      online: 'All of your assessed teaching practice on this course happens on Zoom. Much of what you already know about teaching still applies, but some of it arrives differently: you cannot see the room, you cannot lean over a desk, and silence means something else.',\n      mixed: 'Part of your assessed teaching practice on this course happens on Zoom, and part of it in Room 6. Much of what you already know about teaching still applies, but some of it arrives differently: you cannot see the room, you cannot lean over a desk, and silence means something else.',\n      f2f: 'All of your assessed teaching practice on this course is in Room 6, face to face. You will not teach online here — but you may well teach online later, and the handbook asks that you at least think about the difference before the course starts. Two tasks, not four.',\n    };\n    const smix = (c, p) => 'color-mix(in oklab, ' + c + ' ' + p + '%, transparent)';\n\n    const q = (n, text) => ({ n: n + '.', text });\n    const answered = (text) => ({ answer: text, answerInk: INK, answerStyle: 'normal' });\n    const blank = { answer: 'Write here…', answerInk: MUTED, answerStyle: 'italic' };\n\n    const PARTS = {\n      online: {\n        letter: 'A',\n        title: 'Teaching in a virtual classroom',\n        intro: INTRO[mode] || INTRO.mixed,\n        _f2f: mode === 'f2f',\n        tasks: [\n          Object.assign({ label: 'Task 1', questions: [\n            q(1, 'Think of a lesson you have taught or watched face to face. Which parts of it would work unchanged online, and which would not?'),\n            q(2, 'For one part that would not work, write down what you would do instead.'),\n          ] }, answered('Pair work would survive — breakout rooms do the same job. Monitoring would not. Face to face I would walk between desks and hear who is stuck; online I would have to join each room in turn and I would only hear one at a time.')),\n          Object.assign({ label: 'Task 2', questions: [\n            q(1, 'You give an instruction and nobody responds. List three reasons that might happen online which would not happen in a classroom.'),\n            q(2, 'How would you find out which one it was?'),\n          ] }, blank),\n          Object.assign({ label: 'Task 3', questions: [\n            q(1, 'How would you check that learners have understood a new word, without seeing their faces?'),\n          ] }, blank),\n          Object.assign({ label: 'Task 4', questions: [\n            q(1, 'Your screen share fails two minutes into the lesson and cannot be fixed. What do you do with the next five minutes?'),\n          ] }, blank),\n        ],\n      },\n      l1: {\n        letter: 'B',\n        title: 'The use of L1',\n        intro: 'Your teaching practice classes in Istanbul are largely monolingual, and Turkish is in the room whether or not it is on the board. Some centres ban it, some use it deliberately. The syllabus expects you to have a view.',\n        tasks: [\n          Object.assign({ label: 'Task 5', questions: [\n            q(1, 'Write down two moments in a lesson where a learner using their own language would help their learning, and two where it would not.'),\n          ] }, answered('Helps: checking they have understood a task before starting it, and comparing a structure with Turkish when the difference is the problem. Does not help: doing the speaking task itself, or asking a classmate what a word means when working it out is the point.')),\n          Object.assign({ label: 'Task 6', questions: [\n            q(1, 'You do not speak your learners\\u2019 language. Does that make you a better or worse teacher for them? Give one reason each way.'),\n          ] }, blank),\n          Object.assign({ label: 'Task 7', questions: [\n            q(1, 'A learner asks you, in Turkish, what a word means. You know the Turkish word. What do you do, and why?'),\n            q(2, 'Would your answer change if the class were multilingual?'),\n          ] }, blank),\n        ],\n      },\n    };\n\n    const supTabs = [\n      { key: 'online', label: mode === 'f2f' ? 'A · Teaching online (awareness)' : 'A · Teaching online' },\n      { key: 'l1', label: 'B · The use of L1' },\n    ].map(t => ({\n      label: t.label,\n      pick: () => this.setState({ part: t.key }),\n      bg: t.key === part ? CARD : 'transparent',\n      border: t.key === part ? TEAL : BORDER,\n      ink: t.key === part ? TEAL : INK,\n    }));\n\n    const modeTabs = [\n      { key: 'f2f', label: 'Face-to-face', sub: 'A (short) + B · 5 tasks' },\n      { key: 'mixed', label: 'Mixed-mode', sub: 'A + B · 7 tasks' },\n      { key: 'online', label: 'Fully online', sub: 'A + B · 7 tasks' },\n    ].map(m => ({\n      label: m.label, sub: m.sub,\n      pick: () => this.setState({ mode: m.key }),\n      bg: m.key === mode ? smix(TEAL, 16) : 'transparent',\n      border: m.key === mode ? TEAL : BORDER,\n      ink: m.key === mode ? TEAL : MUTED,\n    }));\n\n    const supCount = mode === 'f2f' ? '5 tasks' : '7 tasks';\n\n    const supNotes = [\n      { label: 'It is a supplement, and says so', labelInk: MUTED, border: BORDER,\n        text: 'Cambridge\\u2019s five sections are reproduced untouched, © UCLES 2018. This is Section 6, headed with the centre\\u2019s name, so nobody mistakes centre material for Cambridge material — which matters both for copyright and for what an assessor sees.' },\n      { label: 'Same shape as theirs', labelInk: TEAL, border: smix(TEAL, 26),\n        text: 'A short read, then a numbered task, answered in your own words. Ungraded, handed in on day one, never counted as coursework. A candidate should not be able to feel where Cambridge stops and the centre starts, apart from the heading that tells them.' },\n      { label: 'Part A follows the course mode', labelInk: TEAL, border: smix(TEAL, 26),\n        text: 'Switch the mode above and watch the opening line change. Fully online: all of your teaching practice happens on Zoom. Mixed-mode: part on Zoom, part in Room 6. Face-to-face: Part A shrinks to two awareness-raising tasks rather than disappearing — handbook 2.2.3 recommends that single-mode courses still have candidates consider how teaching adapts to the other mode, and this is where a centre can point an assessor. Part B goes to everyone, because L1 is in the room whatever the mode.' },\n      { label: 'Seven tasks, not twenty', labelInk: MUTED, border: BORDER,\n        text: 'The Cambridge task already runs to 33 pages and candidates are doing it around a job. Four on teaching online, three on L1, and nothing that needs a book to answer.' },\n      { label: 'The answers are worth reading', labelInk: MUTED, border: BORDER,\n        text: 'Ungraded does not mean unread. Task 5 and Task 7 tell a tutor what a candidate already believes about L1 before week one, which is exactly the belief that surfaces in TP2 when a learner asks them something in Turkish.' },\n    ];\n\n    const chosen = PARTS[part];\n    const trimmed = (part === 'online' && mode === 'f2f')\n      ? Object.assign({}, chosen, { tasks: chosen.tasks.slice(0, 2) })\n      : chosen;\n    const sup = { supTabs, supNotes, modeTabs, supCount, part: trimmed };\n\n    const sentence = (n, text, verdict, fix) => ({\n      n: String(n) + '.', text,\n      rowBg: verdict ? 'transparent' : 'transparent',\n      okBg: verdict === 'ok' ? 'color-mix(in oklab, ' + GREEN + ' 12%, ' + CARD + ')' : 'transparent',\n      okBorder: verdict === 'ok' ? 'color-mix(in oklab, ' + GREEN + ' 38%, transparent)' : BORDER,\n      okInk: verdict === 'ok' ? GREEN : MUTED,\n      badBg: verdict === 'bad' ? 'color-mix(in oklab, ' + AMBER + ' 14%, ' + CARD + ')' : 'transparent',\n      badBorder: verdict === 'bad' ? 'color-mix(in oklab, ' + AMBER + ' 40%, transparent)' : BORDER,\n      badInk: verdict === 'bad' ? AMBER : MUTED,\n      fix: fix || (verdict === 'bad' ? 'Write the correct version…' : ''),\n      fixInk: fix ? INK : MUTED,\n    });\n\n    const chip = (n, word, answer) => ({\n      n: String(n), word, answer: answer || 'Choose…',\n      bg: answer ? 'color-mix(in oklab, ' + TEAL + ' 8%, ' + CARD + ')' : 'transparent',\n      border: answer ? 'color-mix(in oklab, ' + TEAL + ' 30%, transparent)' : BORDER,\n      ink: INK,\n      answerInk: answer ? TEAL : MUTED,\n    });\n\n    return {\n      ...sup,\n      sections: SECTIONS.map((s, i) => ({\n        unit: s.unit,\n        title: s.title,\n        count: s.done + '/' + s.total,\n        pct: Math.round((s.done / s.total) * 100) + '%',\n        bar: s.done === s.total ? GREEN : s.done > 0 ? TEAL : BORDER,\n        pick: () => this.setState({ section: i }),\n        bg: i === section ? 'color-mix(in oklab, oklch(92% 0.028 190) 40%, ' + CARD + ')' : 'transparent',\n        rule: i === section ? TEAL : 'transparent',\n        ink: i === section ? INK : MUTED,\n        weight: i === section ? '600' : '500',\n      })),\n      books: [\n        'Parrott, M. (2010) Grammar for English Teachers',\n        'Swan, M (2016) Practical English Usage',\n        'Scrivener, J (2011) Learning Teaching',\n      ],\n      tasks: [\n        {\n          num: 'Task 6', heading: 'Associations with the word ‘grammar’',\n          prompt: 'Make a list of associations you have with the word ‘grammar’. (They may not all be negative!)',\n          state: 'Answered', border: FAINT,\n          numInk: MUTED, isText: true, isSentences: false, isWordClass: false, boxH: '72px',\n          answer: 'Rules. Red pen. Tables of endings I memorised at school and never used. But also — the moment a pattern clicked and I could suddenly say something new.',\n          answerInk: INK,\n        },\n        {\n          num: 'Task 7', heading: 'Which are correct?',\n          prompt: 'Look at the following sentences and decide which are correct. Write a correct version of the examples that are incorrect.',\n          state: 'In progress', border: 'color-mix(in oklab, ' + TEAL + ' 32%, transparent)',\n          numInk: TEAL, isText: false, isSentences: true, isWordClass: false, boxH: '0px', answer: '', answerInk: MUTED,\n          sentences: [\n            sentence(1, 'We’ve been looking for you for ages.', 'ok', ''),\n            sentence(2, 'I’ve been to the movies last night.', 'bad', 'I went to the movies last night.'),\n            sentence(3, 'He often come late.', 'bad', 'He often comes late.'),\n            sentence(4, 'They were waiting by the fountain.', 'ok', ''),\n            sentence(5, 'Can I have a coffee black, please?', 'bad', ''),\n            sentence(6, 'People with 12 items or less can queue here.', null, ''),\n          ],\n        },\n        {\n          num: 'Task 9', heading: 'Identify the underlined words',\n          prompt: 'Use a grammar reference book or a dictionary to help you with this if necessary.',\n          state: 'Not started', border: FAINT,\n          numInk: MUTED, isText: false, isSentences: false, isWordClass: true, boxH: '0px', answer: '', answerInk: MUTED,\n          chips: [\n            chip(1, 'you', 'Pronoun'),\n            chip(2, 'a', 'Article'),\n            chip(3, 'but', ''),\n            chip(4, 'quite', ''),\n            chip(5, 'abstract', ''),\n          ],\n        },\n      ],\n      aggregate: [\n        { text: '2. I’ve been to the movies last night.', pct: '67%', label: '4 of 6', bar: RED, ink: RED },\n        { text: '5. Can I have a coffee black, please?', pct: '50%', label: '3 of 6', bar: AMBER, ink: AMBER },\n        { text: '3. He often come late.', pct: '17%', label: '1 of 6', bar: GREEN, ink: MUTED },\n        { text: '6. People with 12 items or less can queue here.', pct: '17%', label: '1 of 6', bar: GREEN, ink: MUTED },\n        { text: '1. We’ve been looking for you for ages.', pct: '0%', label: '0 of 6', bar: GREEN, ink: MUTED },\n        { text: '4. They were waiting by the fountain.', pct: '0%', label: '0 of 6', bar: GREEN, ink: MUTED },\n      ],\n      cohort: [\n        { name: 'Sara Yılmaz', context: 'Taught young learners, 2 yrs', grammar: '5/6', grammarInk: INK, state: 'Handed in', bg: 'oklch(93.5% 0.008 85)', ink: GREEN },\n        { name: 'Deniz Aksoy', context: 'No teaching experience', grammar: '3/6', grammarInk: AMBER, state: 'Handed in', bg: 'oklch(93.5% 0.008 85)', ink: GREEN },\n        { name: 'Mert Kaya', context: 'Business English, informal', grammar: '4/6', grammarInk: INK, state: 'Handed in', bg: 'oklch(93.5% 0.008 85)', ink: GREEN },\n        { name: 'Elif Demir', context: 'No teaching experience', grammar: '2/6', grammarInk: RED, state: 'Handed in', bg: 'oklch(93.5% 0.008 85)', ink: GREEN },\n        { name: 'Can Şahin', context: 'Volunteer tutoring', grammar: '4/6', grammarInk: INK, state: 'Handed in', bg: 'oklch(93.5% 0.008 85)', ink: GREEN },\n        { name: 'Zeynep Arslan', context: 'Taught adults abroad, 4 yrs', grammar: '6/6', grammarInk: GREEN, state: 'Handed in', bg: 'oklch(93.5% 0.008 85)', ink: GREEN },\n        { name: 'Emre Doğan', context: '—', grammar: '—', grammarInk: MUTED, state: 'Started', bg: 'oklch(93.5% 0.02 85)', ink: 'oklch(44% 0.1 68)' },\n        { name: 'Aylin Koç', context: '—', grammar: '—', grammarInk: MUTED, state: 'Not opened', bg: 'oklch(93.5% 0.012 85)', ink: MUTED },\n      ],\n      notes: [\n        { title: 'Cambridge is explicit that it is ungraded', text: 'So the screen says so twice — a chip in the header and the line in the notice. Candidates who think it counts spend a week on it and arrive exhausted; candidates who think it is optional skip it entirely.' },\n        { title: 'The value is the aggregate, not the answers', text: 'One candidate’s sheet in a folder tells a tutor little. Six sheets, counted, tell you which grammar point to teach on day two. That is the single thing paper cannot do and this can.' },\n        { title: 'It shapes the first week, not the grade', text: 'Task 1 asks about their teaching context, Task 2 why they chose adults. Read alongside the grammar answers, that is the cohort profile a Main Course Tutor otherwise assembles by guesswork in the first two days.' },\n        { title: 'The answers appear in the task itself', text: 'Cambridge publishes the key, so the task is self-check \\u2014 and rather than a separate file or an email, the answer appears beneath each question at a date the centre sets. The candidate returns to the same page and reads their own answer against the right one, which is the only place the comparison is worth making. No attachment to lose and nothing to open in a second window. The centre sets the moment \\u2014 the Friday before, or with the day-one activity — and until then the candidate does the thinking first and still gets the answers before the course starts — which is when they are useful.' },\n        { title: '“Not opened” is the number that matters', text: 'A candidate who has not opened the task nine days out is the candidate who arrives cold. It is the earliest available signal about anyone on the course, and it costs one email to act on.' },\n      ],\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
